<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AZANA Sketch to Image - Coretan Jadi Gambar Nyata">
    <meta name="twitter:description" content="Ubah coretan kasar dan prompt menjadi gambar nyata dengan AI Clipdrop.">
    <meta name="twitter:image" content="https://azana.my.id/asset/img/globe.png">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3077542320658858" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], tech: ['Rajdhani', 'sans-serif'] }, colors: { neon: { cyan: '#00f2fe', purple: '#bc13fe' }, dark: { 950: '#070708', 900: '#0a0a0f', 800: '#13131a', 700: '#1c1c26' } } } } }
    </script>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; min-height: 100%; background-color: #050508; color: #cbd5e1; overflow-x: hidden; }
      body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(188, 19, 254, 0.12) 0%, transparent 45%), radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.12) 0%, transparent 45%); z-index: 1; filter: blur(80px); pointer-events: none; }
      #neural-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; display: block; opacity: 0.7; }
      .glass-card { background: rgba(10, 10, 15, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
      .upload-square { aspect-ratio: 1 / 1; width: 100%; max-width: 300px; background: rgba(255, 255, 255, 0.03); border: 2px dashed rgba(0, 242, 254, 0.3); border-radius: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.4s ease; cursor: pointer; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); }
      .upload-square:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.05); box-shadow: 0 0 30px rgba(0, 242, 254, 0.2), inset 0 0 15px rgba(0, 242, 254, 0.1); transform: scale(1.02); }
      .choice-btn { border: 1px solid rgba(0, 242, 254, 0.18); background: rgba(19, 19, 26, 0.72); color: #94a3b8; transition: all 0.25s ease; }
      .choice-btn:hover, .active-choice { border-color: rgba(0, 242, 254, 0.85); color: #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.18); background: rgba(0, 242, 254, 0.06); }
      #sketch-canvas { width: 100%; max-width: 520px; aspect-ratio: 1 / 1; border-radius: 1.5rem; touch-action: none; cursor: crosshair; box-shadow: 0 0 25px rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 242, 254, 0.22); }
      .safe-italic { padding-right: 0.3em; display: inline-block; }
    </style>
  </head>
  <body data-tool="sketch">
    <canvas id="neural-bg"></canvas>
    <div class="relative z-10 flex-grow flex flex-col items-center p-6 w-full">
      <header class="text-center w-full max-w-3xl mt-12 mb-10 flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-dark-900/30 backdrop-blur-md border border-neon-cyan/20 flex items-center justify-center text-neon-cyan mb-6 shadow-lg"><i class="fas fa-pen-nib text-xl"></i></div>
        <h1 class="text-2xl md:text-4xl font-tech font-bold text-white tracking-[0.2em] uppercase italic leading-tight">AZANA <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-purple to-neon-cyan safe-italic">SKETCH AI</span></h1>
        <p class="text-slate-500 text-[10px] md:text-xs max-w-xs mx-auto mt-6 opacity-70 uppercase tracking-[0.3em]">Coretan kasar jadi gambar nyata dengan Clipdrop</p>
      </header>

      <main class="w-full max-w-6xl grid lg:grid-cols-[1.1fr_0.9fr] gap-6 items-start">
        <section class="glass-card rounded-[2rem] p-5 md:p-8 shadow-2xl">
          <div class="flex items-center justify-between gap-4 mb-4">
            <h2 class="font-tech text-white text-xl tracking-widest uppercase"><i class="fas fa-pencil-alt text-neon-cyan mr-2"></i>Canvas Sketsa</h2>
            <label class="text-[10px] uppercase tracking-widest text-neon-cyan hover:text-white cursor-pointer transition"><i class="fas fa-upload mr-2"></i>Upload Sketsa<input id="sketch-upload" type="file" accept="image/png,image/jpeg,image/webp" class="hidden"></label>
          </div>
          <canvas id="sketch-canvas" width="768" height="768" aria-label="Canvas untuk menggambar sketsa"></canvas>
          <div class="flex flex-wrap gap-3 mt-5">
            <button class="brush-btn choice-btn active-choice rounded-xl px-4 py-3 text-[10px] font-bold uppercase tracking-widest" data-size="5">Tipis</button>
            <button class="brush-btn choice-btn rounded-xl px-4 py-3 text-[10px] font-bold uppercase tracking-widest" data-size="10">Sedang</button>
            <button class="brush-btn choice-btn rounded-xl px-4 py-3 text-[10px] font-bold uppercase tracking-widest" data-size="18">Tebal</button>
            <button id="btn-clear" class="ml-auto rounded-xl px-4 py-3 bg-dark-800 border border-neon-purple/30 text-neon-purple text-[10px] font-bold uppercase tracking-widest hover:bg-neon-purple hover:text-white transition"><i class="fas fa-trash mr-2"></i>Bersihkan</button>
          </div>
        </section>

        <section class="glass-card rounded-[2rem] p-5 md:p-8 shadow-2xl">
          <h2 class="font-tech text-white text-xl tracking-widest uppercase mb-4"><i class="fas fa-wand-magic-sparkles text-neon-purple mr-2"></i>Prompt Deskripsi</h2>
          <label for="prompt-input" class="text-[10px] uppercase tracking-[0.25em] text-slate-500">Contoh: Pemandangan gunung realistis saat sunrise</label>
          <textarea id="prompt-input" rows="6" maxlength="1000" class="mt-3 w-full rounded-2xl bg-dark-900/70 border border-neon-cyan/20 focus:border-neon-cyan outline-none text-white p-4 text-sm resize-none" placeholder="Tulis prompt deskripsi gambar yang kamu inginkan..."></textarea>
          <button id="btn-process" class="mt-6 w-full bg-gradient-to-r from-neon-purple to-neon-cyan text-white font-tech font-bold tracking-[0.2em] py-4 rounded-2xl shadow-lg hover:scale-[1.01] active:scale-95 transition uppercase"><i class="fas fa-magic mr-2"></i>Generate Gambar</button>
          <p id="tool-status" class="mt-4 min-h-[1.25rem] text-[10px] uppercase tracking-[0.2em] text-slate-400"></p>
        </section>
      </main>

      <section id="result-area" class="hidden w-full max-w-4xl flex-col items-center mt-8 glass-card rounded-[2rem] p-5 md:p-8 shadow-2xl">
        <h2 class="font-tech text-white text-2xl tracking-widest uppercase mb-5"><i class="fas fa-image text-neon-cyan mr-2"></i>Hasil AI</h2>
        <img id="result-image" alt="Hasil Sketch to Image AZANA" class="max-w-full rounded-2xl border border-neon-cyan/20 shadow-2xl">
        <a id="btn-download" href="#" download="azana-sketch-to-image.png" class="mt-6 inline-flex items-center gap-2 bg-dark-800 border border-neon-cyan/30 px-6 py-3 rounded-xl text-[10px] text-neon-cyan hover:bg-neon-cyan hover:text-dark-900 transition-all uppercase tracking-[0.2em] font-bold"><i class="fas fa-download"></i>Simpan Gambar</a>
      </section>
    </div>
    <div id="footer" data-src="components/footer-ai.html"></div>
    <script src="asset/js/clipdrop-ai-tools.js"></script>
  </body>
</html>
