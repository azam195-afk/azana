  <script>
    // --- ANIMASI NEURAL BACKGROUND ---
    const canvas = document.getElementById('neural-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initNodes();
    });

    resizeCanvas();

    const particlesArray = [];
    const colors = ['#00f2fe', '#bc13fe'];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.speedX = (Math.random() * 0.5) - 0.25;
        this.speedY = (Math.random() * 0.5) - 0.25;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initNodes() {
      particlesArray.length = 0;
      let numberOfParticles = (canvas.height * canvas.width) / 9500;
      if (numberOfParticles > 130) numberOfParticles = 130;
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateNodes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
        for (let j = i; j < particlesArray.length; j++) {
          const dx = particlesArray[i].x - particlesArray[j].x;
          const dy = particlesArray[i].y - particlesArray[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 150) {
            ctx.beginPath();
            ctx.strokeStyle = particlesArray[i].color;
            ctx.globalAlpha = 1 - (distance / 150);
            ctx.lineWidth = 0.6;
            ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
            ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
        }
      }
      requestAnimationFrame(animateNodes);
    }

    window.onload = function() {
      initNodes();
      animateNodes();
    };

    // --- LOGIKA REMOVE BG TETAP UTUH ---
    let API_KEY_REMOVE_BG = window.AZANA_API_KEYS?.REMOVE_BG || localStorage.getItem('AZANA_REMOVE_BG_API_KEY') || '';
    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const processingArea = document.getElementById('processing-area');
    const resultArea = document.getElementById('result-area');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status-text');

    function tangkapFoto(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('File harus berupa gambar PNG, JPG, JPEG, atau WEBP.');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview-image').src = e.target.result;
        uploadArea.classList.add('hidden');
        processingArea.classList.remove('hidden');
        processingArea.classList.add('flex');
        prosesHapusLatar(file);
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', (e) => { if(e.target.files.length > 0) tangkapFoto(e.target.files[0]); });

    uploadArea.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        fileInput.click();
      }
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadArea.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadArea.classList.add('border-neon-purple/60', 'bg-white/[0.06]');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadArea.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadArea.classList.remove('border-neon-purple/60', 'bg-white/[0.06]');
      });
    });

    uploadArea.addEventListener('drop', (event) => {
      const file = event.dataTransfer?.files?.[0];
      if (file) tangkapFoto(file);
    });

    async function prosesHapusLatar(file) {
      let progress = 0;
      const interval = setInterval(() => { if(progress < 95) { progress += 2; progressBar.style.width = progress + '%'; } }, 150);
      try {
        if (!API_KEY_REMOVE_BG) {
          throw new Error('API key remove.bg belum dikonfigurasi oleh admin.');
        }
        const formData = new FormData();
        formData.append('size', 'auto');
        formData.append('image_file', file);
        const response = await fetch('https://api.remove.bg/v1.0/removebg', {
          method: 'POST',
          headers: { 'X-Api-Key': API_KEY_REMOVE_BG },
          body: formData
        });
        if (!response.ok) throw new Error("Gagal memproses");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        clearInterval(interval);
        progressBar.style.width = '100%';
        statusText.innerText = "SELESAI!";
        setTimeout(() => {
          processingArea.classList.add('hidden');
          resultArea.classList.remove('hidden');
          resultArea.classList.add('flex');
          document.getElementById('result-enhanced').src = url;
          document.getElementById('download-btn').href = url;
        }, 600);
      } catch (err) { alert("Error: " + err.message); location.reload(); }
    }
  </script>
