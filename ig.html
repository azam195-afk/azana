<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(135deg, rgba(18, 24, 38, 0.95), rgba(13, 17, 28, 0.95));
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-purple-900/30 relative z-10">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-purple-400 uppercase font-bold">INSTAGRAM ROOM</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-black/40 border border-pink-500/30 flex items-center justify-center text-pink-400 text-2xl shadow-[0_0_15px_rgba(236,72,153,0.3)]">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1">INSTAGRAM DOWNLOADER</h1>
                <p class="text-[11px] text-gray-400">Download Reels, Video, Foto, atau Story IG tanpa watermark.</p>
            </div>

            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="text" id="ig-url" placeholder="Tempel link Instagram di sini..." 
                        class="w-full bg-black/50 border border-purple-500/30 rounded-2xl py-3 px-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-pink-400 transition">
                </div>
                <button onclick="processInstagramDownload()" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-pink-600 hover:bg-pink-500 rounded-xl text-xs font-semibold text-white transition shadow-lg shadow-pink-600/30 cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i> Cek / Proses Link
                </button>
            </div>

            <div id="loading-box" class="hidden text-center py-6 text-pink-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil data Instagram...
            </div>

            <div id="preview-container" class="hidden mt-4 space-y-3">
                <div id="media-view-area" class="w-full overflow-hidden rounded-2xl bg-black/40 border border-pink-500/30 flex justify-center">
                    </div>

                <button onclick="downloadMedia(currentMediaUrl, 'instagram_video.mp4', this)" class="w-full flex items-center justify-between py-3 px-4 bg-pink-600/30 hover:bg-pink-600/50 border border-pink-500/40 rounded-xl text-xs font-semibold text-pink-200 transition cursor-pointer">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-download text-pink-400"></i> Download Media (Video/Foto)</span>
                    <span class="text-[10px] bg-pink-500/20 px-2 py-0.5 rounded text-pink-300">HD</span>
                </button>
            </div>

        </div>
    </main>

    <div id="footer" class="relative z-10"></div>

    <script src="asset/js/all-tools-api.js"></script>
    <script>
        let currentMediaUrl = "";

                async function processInstagramDownload() {
            const urlInput = document.getElementById('ig-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');
            const viewArea = document.getElementById('media-view-area');

            if (!urlInput) {
                alert('Masukkan link Instagram terlebih dahulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                const result = await downloadInstagram(urlInput);
                
                if (result && result.status === "success") {
                    currentMediaUrl = result.url;

                    // Tampilkan kotak info bersih tanpa iframe yang diblokir IG
                    viewArea.innerHTML = `
                        <div class="p-6 text-center space-y-3">
                            <div class="w-16 h-16 mx-auto bg-pink-500/20 rounded-full flex items-center justify-center text-pink-400 text-3xl">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                            <h3 class="text-sm font-bold text-white">Link Instagram Berhasil Diproses!</h3>
                            <p class="text-[11px] text-gray-400 break-all px-2">${result.url}</p>
                        </div>
                    `;
                    
                    loadingBox.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                } else {
                    throw new Error(result?.message || "Gagal mengambil data Instagram.");
                }
            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
                }
        
async function downloadMedia(fileUrl, filename, buttonElement) {
    if (!fileUrl) {
        alert("Link unduhan tidak tersedia!");
        return;
    }

    let targetUrl = fileUrl;
    if (targetUrl.includes('/embed')) {
        targetUrl = targetUrl.replace(/\/embed\/?$/, '');
    }

    const originalContent = buttonElement.innerHTML;
    buttonElement.disabled = true;
    buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengunduh...`;

    try {
        // Membuat elemen link unduhan langsung di halaman web lu sendiri
        const a = document.createElement('a');
        a.href = targetUrl;
        a.setAttribute('download', 'instagram_video.mp4');
        a.setAttribute('target', '_self');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    } catch (err) {
        window.location.href = targetUrl;
    } finally {
        setTimeout(() => {
            buttonElement.disabled = false;
            buttonElement.innerHTML = originalContent;
        }, 2000);
    }
}
        

        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      const colors = ['#ec4899', '#bc13fe'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 1 - (distance / 150);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
