<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Service - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Panggil file konfigurasi API lu -->
    <script src="asset/js/api-config.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { 
            background-color: #FEFFFF !important; 
            color: #17252A !important; 
            font-family: 'Inter', sans-serif; 
            height: 100dvh; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        #neural-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            pointer-events: none; 
            opacity: 0.6; 
        }
        header { flex-shrink: 0; }
        .chat-container { 
            flex: 1 1 0%;
            min-height: 0;
            overflow-y: auto; 
            padding: 20px 20px 90px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            scroll-behavior: smooth; 
        }
        .bubble { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 12px; line-height: 1.6; position: relative; word-wrap: break-word; }
        .bubble-user { align-self: flex-end; background: linear-gradient(135deg, #3AAFA9, #2B7A78); color: white; border-bottom-right-radius: 5px; box-shadow: 0 4px 10px rgba(43, 122, 120, 0.2); }
        .bubble-ai { align-self: flex-start; background: #DEF2F1; color: #17252A; border: 1px solid #B7E4E1; border-bottom-left-radius: 5px; box-shadow: 0 4px 10px rgba(58, 175, 169, 0.1); }
        .bubble-ai p { margin: 0 0 8px 0; }
        .bubble-ai p:last-child { margin-bottom: 0; }
        .ai-info { font-size: 9px; color: #2B7A78; margin-bottom: 4px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .input-area { 
            flex-shrink: 0;
            background: #FEFFFF; 
            padding: 12px 15px; 
            border-top: 1px solid #E0E0E0; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 100; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.03); 
        }
        .main-input-row { display: flex; gap: 10px; }
        textarea { flex-grow: 1; background: white; border: 1px solid #B7E4E1; border-radius: 15px; padding: 10px 15px; font-size: 12px; color: #17252A; resize: none; height: 42px; line-height: 1.4; }
        textarea:focus { outline: none; border-color: #3AAFA9; }
        .send-btn { background: linear-gradient(135deg, #3AAFA9, #2B7A78); color: white; border: none; border-radius: 15px; width: 42px; height: 42px; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
        .typing-indicator { font-size: 10px; color: #A7A7A7; margin-left: 5px; display: none; font-style: italic; }
    </style>
</head>
<body>
    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-slate-100 bg-[#FEFFFF]/90 backdrop-blur-sm z-10">
        <a href="index.html" class="text-[#2B7A78] hover:text-[#3AAFA9] transition flex items-center gap-2 text-sm font-semibold"><i class="fa-solid fa-arrow-left"></i> KEMBALI</a>
        <div class="text-center">
            <span class="text-xs tracking-widest text-[#2B7A78] uppercase font-bold">ALISIA - AZANA CS</span>
            <div class="text-[9px] text-slate-500 mt-0.5">Online • AI Powered by Mistral</div>
        </div>
        <div class="w-16"></div>
    </header>

    <div id="chat-container" class="chat-container"></div>

    <div class="input-area">
        <div id="typing-indicator" class="typing-indicator">Alisia sedang mengetik...</div>
        <div class="main-input-row">
            <textarea id="chat-input" placeholder="Tanyakan sesuatu tentang Azana Tools..." onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // Mengambil API Key dari file api-config.js
        function getMistralKey() {
            if (window.AZANA_API_KEYS && window.AZANA_API_KEYS.MISTRAL_API_KEY) {
                return window.AZANA_API_KEYS.MISTRAL_API_KEY;
            }
            return "";
        }

        // Histori chat untuk menjaga memori percakapan dengan Mistral
        let chatHistory = [
            {
                role: "system",
                content: "Kamu adalah Alisia, Customer Service profesional dan ramah untuk website Azana Tools. Panggil pengguna dengan sebutan 'Sobat'. Informasi tentang Azana Tools: 1. Platform web penyedia tools AI dan utilitas digital gratis. 2. Fitur utama: AI Unblur Foto (menjernihkan foto buram), AI Chat Room (ruang obrolan berbagai model AI), serta tools kreatif lainnya. Jawab pertanyaan dengan akurat, ramah, to the point, dan gunakan format baris baru (enter/nomor) jika memberikan langkah-langkah."
            }
        ];

        window.onload = function() {
            initNodes(); 
            animateNodes();
            
            // Langsung tampilkan pesan sambutan lokal tanpa error
            appendAiMessage("Alisia CS", "Halo Sobat! Selamat datang di Azana Tools. Ada yang bisa aku bantu seputar fitur-fitur di web ini?");
        };

        function appendAiMessage(sender, text) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex flex-col items-start w-full';
            
            const formattedText = text.replace(/\n/g, '<br>');
            wrapper.innerHTML = `<div class="ai-info"><i class="fa-solid fa-headset"></i> ${sender.toUpperCase()}</div><div class="bubble bubble-ai">${formattedText}</div>`;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input'), text = input.value.trim();
            if (!text) return;

            const apiKey = getMistralKey();
            if (!apiKey) {
                alert("Mistral API Key belum terbaca di api-config.js!");
                return;
            }

            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="bubble bubble-user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;
            
            document.getElementById('typing-indicator').style.display = 'block';

            // Masukkan pesan user ke histori
            chatHistory.push({ role: "user", content: text });

            try {
                const response = await fetch("https://api.mistral.ai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "mistral-large-latest",
                        messages: chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById('typing-indicator').style.display = 'none';

                let reply = "Maaf Sobat, terjadi kendala saat memproses jawaban.";
                if (data.choices && data.choices[0].message) {
                    reply = data.choices[0].message.content;
                    // Masukkan jawaban AI ke histori agar percakapan nyambung
                    chatHistory.push({ role: "assistant", content: reply });
                }

                appendAiMessage("Alisia CS", reply);
            } catch (err) {
                document.getElementById('typing-indicator').style.display = 'none';
                appendAiMessage("Alisia CS", "Koneksi terganggu, silakan coba tanyakan kembali ya Sobat.");
            }
        }

        function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    </script>
    <script>
        const canvas = document.getElementById('neural-bg'), ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const particles = Array.from({length: 80}, () => ({x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, vx: Math.random()-0.5, vy: Math.random()-0.5}));
        function animateNodes() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1; ctx.fillStyle='#3AAFA9'; ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateNodes);
        }
    </script>
</body>
</html>
