<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Service - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #FEFFFF !important; color: #17252A !important; font-family: 'Inter', sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.6; }
        .chat-container { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 90px; scroll-behavior: smooth; }
        .bubble { max-width: 80%; padding: 12px 18px; border-radius: 20px; font-size: 12px; line-height: 1.5; position: relative; word-wrap: break-word; }
        .bubble-user { align-self: flex-end; background: linear-gradient(135deg, #3AAFA9, #2B7A78); color: white; border-bottom-right-radius: 5px; box-shadow: 0 4px 10px rgba(43, 122, 120, 0.2); }
        .bubble-ai { align-self: flex-start; background: #DEF2F1; color: #17252A; border: 1px solid #B7E4E1; border-bottom-left-radius: 5px; box-shadow: 0 4px 10px rgba(58, 175, 169, 0.1); }
        .ai-info { font-size: 9px; color: #2B7A78; margin-bottom: 4px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .input-area { position: fixed; bottom: 0; left: 0; width: 100%; background: #FEFFFF; padding: 12px 15px; border-top: 1px solid #E0E0E0; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .model-select { background: #DEF2F1; color: #2B7A78; border: 1px solid #B7E4E1; padding: 6px 12px; border-radius: 12px; font-size: 10px; font-weight: bold; outline: none; width: 100%; cursor: pointer; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.362%22%20height%3D%22292.362%22%3E%3Cpath%20fill%3D%22%232B7A78%22%20d%3D%22M287.694%2072.694a1.313%201.313%200%200%200-1.856%200L146.181%20214.356%204.525%2072.694a1.313%201.313%200%200%200-1.856%200%201.313%201.313%200%200%200%200%201.856l143.5%20143.5a1.313%201.313%200%200%200%201.856%200l143.5-143.5a1.313%201.313%200%200%200%200-1.856z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 10px top 55%; background-size: 8px auto; padding-right: 25px; }
        .main-input-row { display: flex; gap: 10px; }
        textarea { flex-grow: 1; background: white; border: 1px solid #B7E4E1; border-radius: 15px; padding: 10px 15px; font-size: 12px; color: #17252A; resize: none; height: 42px; line-height: 1.4; }
        textarea:focus { outline: none; border-color: #3AAFA9; }
        .send-btn { background: linear-gradient(135deg, #3AAFA9, #2B7A78); color: white; border: none; border-radius: 15px; width: 42px; height: 42px; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
        .typing-indicator { font-size: 10px; color: #A7A7A7; margin-left: 5px; display: none; font-style: italic; }
    </style>
</head>
<body class="flex flex-col h-screen relative">
    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-slate-100 relative z-10 bg-[#FEFFFF]/90 backdrop-blur-sm">
        <a href="index.html" class="text-[#2B7A78] hover:text-[#3AAFA9] transition flex items-center gap-2 text-sm font-semibold"><i class="fa-solid fa-arrow-left"></i> KEMBALI</a>
        <div class="text-center">
            <span class="text-xs tracking-widest text-[#2B7A78] uppercase font-bold">AZANA ASSISTANT (CS)</span>
            <div id="current-ai-display" class="text-[9px] text-slate-500 mt-0.5">Model: Alisia CS AI</div>
        </div>
        <div class="w-16"></div>
    </header>

    <div id="chat-container" class="chat-container"></div>

    <div class="input-area">
        <select id="ai-model-select" class="model-select" onchange="changeAiModel()">
            <option value="alisia">Alisia (CS Ramah)</option>
            <option value="chatgpt">ChatGPT (CS Profesional)</option>
            <option value="gitagpt">Gita (CS Asisten)</option>
            <option value="natalie">Natalie (CS Support)</option>
        </select>
        <div id="typing-indicator" class="typing-indicator">CS sedang mengetik...</div>
        <div class="main-input-row">
            <textarea id="chat-input" placeholder="Tanyakan sesuatu tentang Azana Tools..." onkeydown="handleKeyDown(event)"></textarea>
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const aiModels = {
            'alisia': { name: 'Alisia CS', endpoint: '/ai/alisia' },
            'chatgpt': { name: 'ChatGPT CS', endpoint: '/ai/chatgpt' },
            'gitagpt': { name: 'Gita CS', endpoint: '/ai/gitagpt' },
            'natalie': { name: 'Natalie CS', endpoint: '/ai/Natalie' }
        };

        let currentModelKey = 'alisia', activeController = null;

        // Pengetahuan dasar tentang Website Azana Tools
        const websiteContext = "Konteks Website: Azana Tools adalah platform web praktis buatan kreator untuk berbagai tools AI dan utilitas digital gratis, termasuk fitur AI Unblur Foto untuk menjernihkan gambar buram lewat link/proses online, dan ruang AI Chat interaktif dengan berbagai model pilihan. Panggil user dengan sebutan 'Sobat' atau 'Teman'. Jawab pertanyaan user dengan ramah, akurat, langsung pada inti pembahasan seputar fitur web ini, dan jangan melenceng.";

        window.onload = () => {
            initNodes(); animateNodes();
            // Langsung sapa user sebagai CS
            appendAiMessage(aiModels.alisia.name, "Halo Sobat! Selamat datang di Azana Tools. Aku asisten virtual di sini, ada yang bisa aku bantu seputar fitur-fitur web ini?");
        };

        function appendAiMessage(sender, text) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex flex-col items-start';
            wrapper.innerHTML = `<div class="ai-info"><i class="fa-solid fa-headset"></i> ${sender.toUpperCase()}</div><div class="bubble bubble-ai">${text}</div>`;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function changeAiModel() {
            if (activeController) activeController.abort();
            currentModelKey = document.getElementById('ai-model-select').value;
            const modelName = aiModels[currentModelKey].name;
            document.getElementById('current-ai-display').textContent = `Model: ${modelName}`;
            
            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="text-center text-[9px] text-slate-400 my-1 italic">Beralih ke ${modelName}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input'), text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('chat-container');
            container.innerHTML += `<div class="bubble bubble-user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;
            
            document.getElementById('typing-indicator').style.display = 'block';
            activeController = new AbortController();

            try {
                // Menggabungkan konteks website agar AI tidak salah jawab atau melenceng
                const promptFinal = `${websiteContext} Pertanyaan dari Sobat: "${text}". Berikan jawaban yang relevan, ramah, dan to the point.`;

                const res = await fetch(`https://api.nexray.eu.cc${aiModels[currentModelKey].endpoint}?text=${encodeURIComponent(promptFinal)}`, { signal: activeController.signal });
                const data = await res.json();
                
                document.getElementById('typing-indicator').style.display = 'none';
                
                let reply = "Maaf Sobat, server sedang mengalami gangguan koneksi sebentar.";
                if (data.status) {
                    reply = typeof data.result === 'object' ? (data.result.text || JSON.stringify(data.result)) : data.result;
                }
                appendAiMessage(aiModels[currentModelKey].name, reply);
            } catch (err) { 
                if(err.name !== 'AbortError') {
                    document.getElementById('typing-indicator').style.display = 'none';
                    appendAiMessage(aiModels[currentModelKey].name, "Koneksi terganggu, silakan coba tanyakan kembali ya Sobat.");
                } 
            }
        }

        function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    </script>
    <script>
        const canvas = document.getElementById('neural-bg'), ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const particles = Array.from({length: 80}, () => ({x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, vx: Math.random()-0.5, vy: Math.random()-0.5}));
        function animateNodes() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; if(p.x<0||p.x>canvas.width) p.vx*=-1; if(p.y<0||p.y>canvas.height) p.vy*=-1; ctx.fillStyle='#3AAFA9'; ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateNodes);
        }
        animateNodes();
    </script>
</body>
</html>
