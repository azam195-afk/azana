<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(135deg, rgba(18, 24, 38, 0.9), rgba(13, 17, 28, 0.9));
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <!-- CANVAS BACKGROUND NEURAL ENGINE -->
    <canvas id="neural-bg"></canvas>

    <!-- HEADER -->
    <header class="p-4 flex items-center justify-between border-b border-purple-900/30 relative z-10">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-purple-400 uppercase font-bold">TikTok Room</span>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-6 w-full text-center">
            
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-black/40 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-3xl shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                <i class="fa-brands fa-tiktok"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-wider mb-1">TIKTOK DOWNLOADER</h1>
            <p class="text-xs text-gray-400 mb-6">Preview video, pilih format HD atau Audio MP3 tanpa watermark.</p>

            <div class="space-y-4">
                <div class="relative">
                    <input type="text" id="tiktok-url" placeholder="Tempel link TikTok di sini..." 
                        class="w-full bg-black/50 border border-purple-500/30 rounded-2xl py-3 px-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition">
                </div>
                <button onclick="processTikTokDownload()" id="btn-process" 
                    class="w-full py-3.5 rounded-2xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white shadow-lg shadow-purple-900/40 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Proses Video
                </button>
            </div>

            <div id="loading-box" class="hidden mt-6 text-center py-4 text-cyan-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Sedang mengambil data dari server...
            </div>

            <!-- PREVIEW CONTAINER -->
            <div id="preview-container" class="hidden mt-6 text-left bg-black/60 border border-purple-500/30 rounded-2xl p-4 space-y-4">
                <div class="flex items-center gap-3">
                    <video id="preview-video" class="w-20 h-28 object-cover rounded-xl bg-black" controls playsinline></video>
                    <div class="flex-grow overflow-hidden">
                        <span class="inline-block bg-cyan-500/20 text-cyan-400 text-[10px] font-bold px-2 py-0.5 rounded-full mb-1">Berhasil Dimuat</span>
                        <p id="preview-title" class="text-xs text-gray-300 line-clamp-2">Judul video akan tampil di sini...</p>
                        <p id="preview-author" class="text-[10px] text-gray-400 mt-1">@creator</p>
                    </div>
                </div>

                <!-- TOMBOL DOWNLOAD (MENGGUNAKAN ATRIBUT FORCE DOWNLOAD JS) -->
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="triggerDownload(currentVideoUrl, 'tiktok_video_hd.mp4')" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/40 rounded-xl text-xs font-semibold text-purple-200 transition cursor-pointer">
                        <i class="fa-solid fa-download"></i> MP4 HD
                    </button>
                    <button onclick="triggerDownload(currentAudioUrl, 'tiktok_audio.mp3')" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-cyan-600/30 hover:bg-cyan-600/50 border border-cyan-500/40 rounded-xl text-xs font-semibold text-cyan-200 transition cursor-pointer">
                        <i class="fa-solid fa-music"></i> Audio MP3
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER KOMPONEN -->
    <div id="footer" class="relative z-10"></div>

    <!-- SCRIPT API & LOGIC -->
    <script src="asset/js/all-tools-api.js"></script>
    <script>
        let currentVideoUrl = "";
        let currentAudioUrl = "";

        async function processTikTokDownload() {
            const urlInput = document.getElementById('tiktok-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (!urlInput) {
                alert('Masukkan link TikTok terlebih dahulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                const result = await downloadTikTok(urlInput);
                
                if (result.status === "success") {
                    document.getElementById('preview-title').innerText = result.title;
                    document.getElementById('preview-author').innerText = "@" + result.author;
                    
                    currentVideoUrl = result.video_hd;
                    currentAudioUrl = result.audio_mp3;

                    // Set video source untuk preview agar bisa diputar
                    const videoElement = document.getElementById('preview-video');
                    videoElement.src = currentVideoUrl;
                    
                    loadingBox.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                } else {
                    throw new Error(result.message || "Gagal mengambil data.");
                }
            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        // Fungsi unduh paksa agar tidak membuka media player browser
        function triggerDownload(fileUrl, filename) {
            if (!fileUrl || fileUrl === "#") {
                alert("Link download tidak valid!");
                return;
            }

            // Buat elemen <a> tersembunyi dengan atribut download agar di-force download oleh browser HP
            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = filename;
            a.target = '_blank';
            // Beberapa browser mobile butuh penambahan attribute rel
            a.rel = 'noopener noreferrer';
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Load Footer Component
        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <!-- SCRIPT NEURAL ENGINE BACKGROUND -->
    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      const colors = ['#00f2fe', '#bc13fe'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 1 - (distance / 150);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
