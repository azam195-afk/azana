<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #FEFFFF !important;
            color: #17252A !important;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(145deg, rgba(222, 242, 241, 0.95), rgba(254, 255, 255, 0.98)) !important;
            border: 1px solid rgba(58, 175, 169, 0.3) !important;
            box-shadow: 0 10px 35px 0 rgba(58, 175, 169, 0.15) !important;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-slate-200 relative z-10 bg-[#FEFFFF]/90 backdrop-blur-md">
        <a href="index.html" class="text-azana-tealDark hover:text-azana-teal transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-azana-tealDark uppercase font-bold">TIKTOK ROOM</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-[#DEF2F1] border border-[#3AAFA9]/40 flex items-center justify-center text-[#2B7A78] text-2xl shadow-[0_0_15px_rgba(58,175,169,0.25)]">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1 text-[#17252A]">TIKTOK DOWNLOADER</h1>
                <p class="text-[11px] text-slate-600">Preview besar, pilih format, lalu download langsung.</p>
            </div>

            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="text" id="tiktok-url" placeholder="Tempel link TikTok di sini..." 
                        class="w-full bg-white border border-slate-300 rounded-2xl py-3 px-4 text-xs text-[#17252A] placeholder-slate-400 focus:outline-none focus:border-[#3AAFA9] transition shadow-sm">
                </div>
                <button onclick="processTikTokDownload()" id="btn-process" 
                    class="w-full py-3 rounded-2xl font-bold text-xs bg-gradient-to-r from-[#3AAFA9] to-[#2B7A78] hover:opacity-90 text-white shadow-md shadow-[#3AAFA9]/30 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Preview
                </button>
            </div>

            <div id="loading-box" class="hidden text-center py-6 text-[#2B7A78] text-xs font-semibold">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil data dan membuat preview...
            </div>

            <!-- PREVIEW CONTAINER -->
            <div id="preview-container" class="hidden space-y-4 pt-2">
                
                <!-- VIDEO PLAYER BESAR -->
                <div class="relative w-full rounded-2xl overflow-hidden bg-slate-900 border border-slate-300 shadow-inner">
                    <video id="preview-video" class="w-full h-auto max-h-[380px] object-contain mx-auto" controls playsinline></video>
                </div>

                <!-- INFO AKUN & CAPTION -->
                <div class="bg-white/90 border border-slate-200 rounded-2xl p-3.5 space-y-2.5 shadow-sm">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full bg-[#DEF2F1] border border-[#3AAFA9]/40 flex items-center justify-center text-[#2B7A78] text-xs font-bold">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <p id="preview-author" class="text-xs font-bold text-[#17252A]">@creator</p>
                            <span class="text-[9px] text-[#2B7A78] uppercase tracking-wider font-bold">VERIFIED ACCOUNT</span>
                        </div>
                    </div>
                    
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[10px] text-slate-500 font-semibold uppercase">Caption:</span>
                            <button onclick="copyCaption()" class="text-[10px] bg-[#DEF2F1] hover:bg-[#3AAFA9]/20 border border-[#3AAFA9]/40 text-[#2B7A78] px-2.5 py-1 rounded-lg transition flex items-center gap-1 cursor-pointer font-bold">
                                <i class="fa-solid fa-copy"></i> <span id="copy-text">Copy Caption</span>
                            </button>
                        </div>
                        <p id="preview-title" class="text-xs text-slate-700 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-200 max-h-24 overflow-y-auto">Caption video...</p>
                    </div>
                </div>

                <!-- PILIHAN FORMAT DOWNLOAD -->
                <div class="space-y-2 pt-1">
                    <p class="text-[10px] font-bold text-[#2B7A78] uppercase tracking-widest text-center">Pilih Format Unduhan</p>
                    
                    <button onclick="downloadMedia(currentVideoUrl, 'tiktok_hd.mp4', this)" class="w-full flex items-center justify-between py-3 px-4 bg-[#3AAFA9]/15 hover:bg-[#3AAFA9]/25 border border-[#3AAFA9]/40 rounded-xl text-xs font-semibold text-[#17252A] transition cursor-pointer shadow-xs">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-download text-[#2B7A78]"></i> MP4 HD (Tanpa Watermark)</span>
                        <span class="text-[10px] bg-[#3AAFA9]/25 px-2 py-0.5 rounded text-[#17252A] font-bold">HD</span>
                    </button>

                    <button onclick="downloadMedia(currentVideoUrl, 'tiktok_standard.mp4', this)" class="w-full flex items-center justify-between py-3 px-4 bg-white hover:bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 transition cursor-pointer shadow-xs">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-download text-slate-400"></i> MP4 Standar / Watermark</span>
                        <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600">SD</span>
                    </button>

                    <button onclick="downloadMedia(currentAudioUrl, 'tiktok_audio.mp3', this)" class="w-full flex items-center justify-between py-3 px-4 bg-[#2B7A78]/15 hover:bg-[#2B7A78]/25 border border-[#2B7A78]/40 rounded-xl text-xs font-semibold text-[#17252A] transition cursor-pointer shadow-xs">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-music text-[#2B7A78]"></i> Audio MP3 (Original Sound)</span>
                        <span class="text-[10px] bg-[#2B7A78]/25 px-2 py-0.5 rounded text-[#17252A] font-bold">MP3</span>
                    </button>
                </div>

            </div>

        </div>
    </main>

    <div id="footer" class="relative z-10"></div>

    <script src="asset/js/all-tools-api.js"></script>
    <script>
        let currentVideoUrl = "";
        let currentAudioUrl = "";

        async function processTikTokDownload() {
            const urlInput = document.getElementById('tiktok-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (!urlInput) {
                alert('Masukkan link TikTok terlebih dahulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                const result = await downloadTikTok(urlInput);
                
                if (result && result.status === "success") {
                    document.getElementById('preview-title').innerText = result.title;
                    document.getElementById('preview-author').innerText = "@" + result.author;
                    
                    currentVideoUrl = result.video_hd;
                    currentAudioUrl = result.audio_mp3;

                    const videoElement = document.getElementById('preview-video');
                    videoElement.src = currentVideoUrl;
                    
                    loadingBox.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                } else {
                    throw new Error(result?.message || "Gagal mengambil data.");
                }
            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        async function downloadMedia(fileUrl, filename, buttonElement) {
            if (!fileUrl) {
                alert("Link unduhan tidak tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengunduh...`;

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = filename;
                a.setAttribute('download', filename);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2500);
            }
        }

        function copyCaption() {
            const captionText = document.getElementById('preview-title').innerText;
            navigator.clipboard.writeText(captionText).then(() => {
                const copyTextSpan = document.getElementById('copy-text');
                copyTextSpan.innerText = "Copied!";
                setTimeout(() => {
                    copyTextSpan.innerText = "Copy Caption";
                }, 2000);
            }).catch(err => {
                alert("Gagal menyalin caption!");
            });
        }

        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      // Neural background murni hijau tosca & gelap tosca khas Azana
      const colors = ['#3AAFA9', '#2B7A78', '#17252A'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 0.4 - (distance / 400);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
