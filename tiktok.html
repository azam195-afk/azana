<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(135deg, rgba(18, 24, 38, 0.95), rgba(13, 17, 28, 0.95));
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-cyan-900/30 relative z-10">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-cyan-400 uppercase font-bold">TIKTOK ROOM</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-black/40 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl shadow-[0_0_15px_rgba(0,242,254,0.3)]">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1">TIKTOK DOWNLOADER</h1>
                <p class="text-[11px] text-gray-400">Preview besar, pilih format video, audio, atau slide foto JPG.</p>
            </div>

            <!-- Input Form -->
            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="text" id="tiktok-url" placeholder="Tempel link TikTok / Slide Foto di sini..." 
                        class="w-full bg-black/50 border border-cyan-500/30 rounded-2xl py-3 px-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition">
                </div>
                <button onclick="processTikTokDownload()" id="btn-process" 
                    class="w-full py-3 rounded-2xl font-bold text-xs bg-gradient-to-r from-cyan-600 to-purple-600 hover:from-cyan-500 hover:to-purple-500 text-white shadow-lg shadow-cyan-900/40 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Preview
                </button>
            </div>

            <!-- Loading Box -->
            <div id="loading-box" class="hidden text-center py-6 text-cyan-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil data via RapidAPI...
            </div>

            <!-- PREVIEW & HASIL DOWNLOAD CONTAINER -->
            <div id="preview-container" class="hidden space-y-4 pt-2">
                
                <!-- Media Preview -->
                <div class="space-y-3 text-center">
                    <div id="video-preview-wrapper" class="rounded-xl overflow-hidden bg-black aspect-[9/16] max-h-[320px] mx-auto flex items-center justify-center border border-cyan-500/30 relative">
                        <video id="vid-preview" controls class="w-full h-full object-contain hidden"></video>
                        <img id="img-preview" src="" class="w-full h-full object-contain hidden" alt="Preview Image">
                    </div>
                    
                    <!-- Caption & Author info -->
                    <div class="bg-black/40 border border-cyan-500/20 rounded-2xl p-3 text-left">
                        <div class="flex items-center justify-between mb-1">
                            <span id="author-name" class="text-xs font-bold text-cyan-400">@Author</span>
                            <button onclick="copyCaption()" class="text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-lg">Copy Caption</button>
                        </div>
                        <p id="video-caption" class="text-[11px] text-gray-300 line-clamp-3">-</p>
                    </div>
                </div>

                <!-- PILIHAN FORMAT UNDUHAN -->
                <div class="space-y-2">
                    <p class="text-[10px] font-bold tracking-widest text-gray-400 uppercase px-1">Pilih Format Unduhan:</p>
                    <div id="download-options-list" class="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                        <!-- Dynamically injected links/buttons -->
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer Transparan -->
    <div id="footer" class="relative z-10"></div>

    <script>
        let currentData = null;

            async function processTikTokDownload() {
            const urlInput = document.getElementById('tiktok-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (!urlInput) {
                alert('Masukkan link TikTok dulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                // Membungkus endpoint RapidAPI dengan CORS proxy agar tidak diblokir browser
                const targetUrl = 'https://download-tiktok-videos-slide-images.p.rapidapi.com/api';
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-rapidapi-host': 'download-tiktok-videos-slide-images.p.rapidapi.com',
                        'x-rapidapi-key': '9cbf8bd8d4msh68c9733fe4041d3p14ea1fjsnd5afc4aba406'
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                if (!response.ok) throw new Error("Gagal mengambil data dari RapidAPI.");
                const res = await response.json();

                currentData = res.result || res.data || res;
                
                const captionText = currentData.title || currentData.caption || currentData.desc || "Tanpa caption";
                const authorText = currentData.author?.nickname || currentData.author?.unique_id || currentData.author || "TikTok User";
                
                document.getElementById('video-caption').innerText = captionText;
                document.getElementById('author-name').innerText = "@" + authorText;

                const vidElement = document.getElementById('vid-preview');
                const imgElement = document.getElementById('img-preview');
                const listContainer = document.getElementById('download-options-list');
                listContainer.innerHTML = '';

                let imageList = currentData.images || currentData.photo_list || currentData.slide || currentData.photos;

                if (imageList && Array.isArray(imageList) && imageList.length > 0) {
                    vidElement.classList.add('hidden');
                    imgElement.classList.remove('hidden');
                    imgElement.src = imageList[0];

                    const audioUrl = currentData.music || currentData.audio || currentData.sound;
                    if (audioUrl) {
                        addItemToList(listContainer, "Audio MP3 (Original Sound)", "fa-music", audioUrl, "audio.mp3", "text-cyan-400");
                    }

                    imageList.forEach((imgUrl, index) => {
                        addItemToList(listContainer, `JPG Foto #${index + 1} (Slide TikTok)`, "fa-image", imgUrl, `tiktok_photo_${index + 1}.jpg`, "text-emerald-400");
                    });

                } else {
                    imgElement.classList.add('hidden');
                    vidElement.classList.remove('hidden');
                    
                    const videoUrl = currentData.nowm || currentData.hd || currentData.url || currentData.video || currentData.play;
                    const wmUrl = currentData.wm || currentData.watermark;
                    const audioUrl = currentData.music || currentData.audio || currentData.sound;

                    if (videoUrl) {
                        vidElement.src = videoUrl;
                        addItemToList(listContainer, "MP4 HD (Tanpa Watermark)", "fa-video", videoUrl, "tiktok_hd.mp4", "text-cyan-400");
                    }
                    if (wmUrl) {
                        addItemToList(listContainer, "MP4 Standar (Dengan Watermark)", "fa-video", wmUrl, "tiktok_wm.mp4", "text-yellow-400");
                    }
                    if (audioUrl) {
                        addItemToList(listContainer, "Audio MP3 (Original Sound)", "fa-music", audioUrl, "tiktok_audio.mp3", "text-purple-400");
                    }
                }

                loadingBox.classList.add('hidden');
                previewContainer.classList.remove('hidden');

            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
         }
    

        function addItemToList(container, label, iconClass, fileUrl, filename, colorClass) {
            const item = document.createElement('div');
            item.className = "bg-zinc-900/80 border border-zinc-700/50 rounded-xl p-2.5 flex items-center justify-between";
            item.innerHTML = `
                <div class="flex items-center gap-2 overflow-hidden pr-2">
                    <i class="fa-solid ${iconClass} ${colorClass} text-sm"></i>
                    <span class="text-xs font-bold text-gray-200 truncate">${label}</span>
                </div>
                <button onclick="downloadSingleFile('${fileUrl}', '${filename}', this)" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-[10px] px-3 py-1.5 rounded-lg transition shrink-0">
                    ↓ Download
                </button>
            `;
            container.appendChild(item);
        }

        async function downloadSingleFile(fileUrl, filename, buttonElement) {
            const originalText = buttonElement.innerText;
            buttonElement.disabled = true;
            buttonElement.innerText = "Downloading...";

            try {
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = filename;
                a.setAttribute('download', filename);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                window.open(fileUrl, '_blank');
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerText = originalText;
                }, 1500);
            }
        }

        function copyCaption() {
            const captionText = document.getElementById('video-caption').innerText;
            navigator.clipboard.writeText(captionText);
            alert('Caption berhasil disalin!');
        }

        // Load Footer Transparan
        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      const colors = ['#00f2fe', '#bc13fe'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 1 - (distance / 150);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
