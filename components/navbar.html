<script>
    function checkAppMode() {
        // Cek mode standalone
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                             || window.navigator.standalone;
        
        // Cek apakah ada parameter 'utm_source=pwa' (opsional tapi kuat)
        const urlParams = new URLSearchParams(window.location.search);
        const isPWAUrl = urlParams.get('utm_source') === 'pwa';

        if (isStandalone || isPWAUrl) {
            const btnD = document.getElementById('apk-download-desktop');
            const btnM = document.getElementById('apk-download-mobile');
            if(btnD) btnD.style.display = 'none';
            if(btnM) btnM.style.display = 'none';
        }
    }

    // Jalankan langsung dan kasih jeda dikit biar sinkron
    checkAppMode();
    setTimeout(checkAppMode, 1000);
