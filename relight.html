<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZANA AI Relight - Studio Cahaya Virtual</title>
    <meta name="description" content="Tool AI AZANA Relight untuk mengatur pencahayaan foto dengan efek Front Flash, Neon Side, dan Golden Hour menggunakan Clipdrop API.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="author" content="AZANA DESIGN">
    <meta name="theme-color" content="#050508">
    <link rel="canonical" href="https://azana.my.id/relight.html">
    <meta property="og:locale" content="id_ID">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AZANA DESIGN">
    <meta property="og:title" content="AZANA AI Relight - Studio Cahaya Virtual">
    <meta property="og:description" content="Tambahkan cahaya studio virtual Front Flash, Neon Side, atau Golden Hour dengan AI Clipdrop.">
    <meta property="og:url" content="https://azana.my.id/relight.html">
    <meta property="og:image" content="https://azana.my.id/asset/img/globe.png">
    <meta name="twitter:card" content="summary_large_image">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3077542320658858" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="asset/js/api-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], tech: ['Rajdhani', 'sans-serif'] }, colors: { neon: { cyan: '#00f2fe', purple: '#bc13fe' }, dark: { 950: '#070708', 900: '#0a0a0f', 800: '#13131a', 700: '#1c1c26' } } } } }
    </script>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; min-height: 100%; background-color: #050508; color: #cbd5e1; overflow-x: hidden; }
      body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(188, 19, 254, 0.12) 0%, transparent 45%), radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.12) 0%, transparent 45%); z-index: 1; filter: blur(80px); pointer-events: none; }
      #neural-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; display: block; opacity: 0.7; }
      .glass-card { background: rgba(10, 10, 15, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
      .upload-square { aspect-ratio: 1 / 1; width: 100%; max-width: 330px; background: rgba(255, 255, 255, 0.03); border: 2px dashed rgba(0, 242, 254, 0.3); border-radius: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.4s ease; cursor: pointer; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); overflow: hidden; }
      .upload-square:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.05); box-shadow: 0 0 30px rgba(0, 242, 254, 0.2), inset 0 0 15px rgba(0, 242, 254, 0.1); transform: scale(1.02); }
      .choice-btn { border: 1px solid rgba(0, 242, 254, 0.18); background: rgba(19, 19, 26, 0.72); color: #94a3b8; transition: all 0.25s ease; }
      .choice-btn:hover, .active-choice { border-color: rgba(0, 242, 254, 0.85); color: #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.18); background: rgba(0, 242, 254, 0.06); }
      .safe-italic { padding-right: 0.3em; display: inline-block; }
    </style>
  </head>
  <body data-tool="relight">
    <canvas id="neural-bg"></canvas>
    <div class="relative z-10 flex-grow flex flex-col items-center p-6 w-full">
      <header class="text-center w-full max-w-3xl mt-12 mb-10 flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-dark-900/30 backdrop-blur-md border border-neon-cyan/20 flex items-center justify-center text-neon-cyan mb-6 shadow-lg"><i class="fas fa-lightbulb text-xl"></i></div>
        <h1 class="text-2xl md:text-4xl font-tech font-bold text-white tracking-[0.2em] uppercase italic leading-tight">AZANA <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-purple to-neon-cyan safe-italic">AI RELIGHT</span></h1>
        <p class="text-slate-500 text-[10px] md:text-xs max-w-xs mx-auto mt-6 opacity-70 uppercase tracking-[0.3em]">Studio cahaya virtual bertenaga Clipdrop</p>
      </header>

      <main class="w-full max-w-5xl glass-card rounded-[2rem] p-5 md:p-8 shadow-2xl grid lg:grid-cols-[0.9fr_1.1fr] gap-8 items-center">
        <section class="flex flex-col items-center text-center">
          <label for="image-upload" class="upload-square relative">
            <img id="preview-image" alt="Preview foto yang diupload" class="hidden absolute inset-0 w-full h-full object-cover">
            <span class="relative z-10 flex flex-col items-center px-6">
              <i class="fas fa-cloud-upload-alt text-4xl text-neon-cyan mb-4"></i>
              <strong id="upload-label" class="font-tech text-white tracking-widest uppercase">Upload Foto</strong>
              <small class="text-slate-500 text-[10px] mt-2 uppercase tracking-widest">PNG / JPG / WEBP</small>
            </span>
          </label>
          <input id="image-upload" type="file" accept="image/png,image/jpeg,image/webp" class="hidden">
        </section>

        <section>
          <h2 class="font-tech text-white text-xl tracking-widest uppercase mb-4"><i class="fas fa-sun text-neon-purple mr-2"></i>Pilih Pencahayaan</h2>
          <div class="space-y-3">
            <button class="choice-btn active-choice w-full rounded-2xl p-4 text-left" data-light="front"><span class="block font-tech text-lg tracking-widest uppercase text-white">Front Flash</span><span class="text-[10px] uppercase tracking-widest text-slate-500">Cahaya putih dari depan · #ffffff · x:0 y:0 z:1.6</span></button>
            <button class="choice-btn w-full rounded-2xl p-4 text-left" data-light="neon"><span class="block font-tech text-lg tracking-widest uppercase text-white">Neon Side</span><span class="text-[10px] uppercase tracking-widest text-slate-500">Biru #00f2fe & merah #ff2d95 dari samping</span></button>
            <button class="choice-btn w-full rounded-2xl p-4 text-left" data-light="golden"><span class="block font-tech text-lg tracking-widest uppercase text-white">Golden Hour</span><span class="text-[10px] uppercase tracking-widest text-slate-500">Hangat #ffb347 dari sudut atas · x:-0.65 y:-0.85 z:1.35</span></button>
          </div>
          <button id="btn-process" class="mt-6 w-full bg-gradient-to-r from-neon-purple to-neon-cyan text-white font-tech font-bold tracking-[0.2em] py-4 rounded-2xl shadow-lg hover:scale-[1.01] active:scale-95 transition uppercase"><i class="fas fa-bolt mr-2"></i>Terapkan Relight</button>
          <p id="tool-status" class="mt-4 min-h-[1.25rem] text-[10px] uppercase tracking-[0.2em] text-slate-400"></p>
        </section>
      </main>

      <section id="result-area" class="hidden w-full max-w-4xl flex-col items-center mt-8 glass-card rounded-[2rem] p-5 md:p-8 shadow-2xl">
        <h2 class="font-tech text-white text-2xl tracking-widest uppercase mb-5"><i class="fas fa-image text-neon-cyan mr-2"></i>Hasil AI</h2>
        <img id="result-image" alt="Hasil AI Relight AZANA" class="max-w-full rounded-2xl border border-neon-cyan/20 shadow-2xl">
        <a id="btn-download" href="#" download="azana-ai-relight.png" class="mt-6 inline-flex items-center gap-2 bg-dark-800 border border-neon-cyan/30 px-6 py-3 rounded-xl text-[10px] text-neon-cyan hover:bg-neon-cyan hover:text-dark-900 transition-all uppercase tracking-[0.2em] font-bold"><i class="fas fa-download"></i>Simpan Gambar</a>
      </section>
    </div>
    <div id="footer" data-src="components/footer-ai.html"></div>
    <script src="asset/js/clipdrop-ai-tools.js"></script>
  </body>
</html>
