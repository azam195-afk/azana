<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #FEFFFF !important;
            color: #17252A !important;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(145deg, rgba(222, 242, 241, 0.95), rgba(254, 255, 255, 0.98)) !important;
            border: 1px solid rgba(58, 175, 169, 0.3) !important;
            box-shadow: 0 10px 35px 0 rgba(58, 175, 169, 0.15) !important;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-slate-200 relative z-10 bg-[#FEFFFF]/90 backdrop-blur-md">
        <a href="index.html" class="text-azana-tealDark hover:text-azana-teal transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-azana-tealDark uppercase font-bold">FACEBOOK ROOM</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-[#DEF2F1] border border-[#3AAFA9]/40 flex items-center justify-center text-[#2B7A78] text-2xl shadow-[0_0_15px_rgba(58,175,169,0.25)]">
                    <i class="fa-brands fa-facebook"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1 text-[#17252A]">FACEBOOK DOWNLOADER</h1>
                <p class="text-[11px] text-slate-600">Download Video, Reels, atau Story Facebook dengan mudah.</p>
            </div>

            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="text" id="fb-url" placeholder="Tempel link Facebook di sini..." 
                        class="w-full bg-white border border-slate-300 rounded-2xl py-3 px-4 text-xs text-[#17252A] placeholder-slate-400 focus:outline-none focus:border-[#3AAFA9] transition shadow-sm">
                </div>
                <button onclick="processFacebookDownload()" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-gradient-to-r from-[#3AAFA9] to-[#2B7A78] hover:opacity-90 rounded-xl text-xs font-semibold text-white transition shadow-md shadow-[#3AAFA9]/30 cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i> Cek / Proses Link
                </button>
            </div>

            <div id="loading-box" class="hidden text-center py-6 text-[#2B7A78] text-xs font-semibold">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil data Facebook...
            </div>

            <div id="preview-container" class="hidden mt-4 space-y-3">
                <div id="media-view-area" class="w-full overflow-hidden rounded-2xl bg-white/80 border border-slate-300 flex justify-center shadow-inner">
                </div>

                <button onclick="downloadMedia(currentMediaUrl, 'facebook_video.mp4', this)" class="w-full flex items-center justify-between py-3 px-4 bg-[#3AAFA9]/15 hover:bg-[#3AAFA9]/25 border border-[#3AAFA9]/40 rounded-xl text-xs font-semibold text-[#17252A] transition cursor-pointer shadow-xs">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-download text-[#2B7A78]"></i> Download Video Facebook</span>
                    <span class="text-[10px] bg-[#3AAFA9]/25 px-2 py-0.5 rounded text-[#17252A] font-bold">HD</span>
                </button>
            </div>

        </div>
    </main>

    <div id="footer" class="relative z-10"></div>

    <script src="asset/js/all-tools-api.js"></script>
    <script>
        let currentMediaUrl = "";

        async function processFacebookDownload() {
    const urlInput = document.getElementById('fb-url').value.trim();
    const loadingBox = document.getElementById('loading-box');
    const previewContainer = document.getElementById('preview-container');
    const viewArea = document.getElementById('media-view-area');

    if (!urlInput) {
        alert('Masukkan link Facebook terlebih dahulu, bro!');
        return;
    }

    loadingBox.classList.remove('hidden');
    previewContainer.classList.add('hidden');

    try {
        const response = await fetch(`https://api.nexray.eu.cc/downloader/facebook?url=${encodeURIComponent(urlInput)}`);
        const result = await response.json();
        
        console.log("Response API:", result); // Buat dicek lewat console browser jika masih gagal

        // Menangkap berbagai kemungkinan struktur data dari API
        const mediaUrl = result.url || result.data?.url || result.data?.video || result.result || (Array.isArray(result.data) ? result.data[0]?.url : null);
        const thumbnailImg = result.thumbnail || result.data?.thumbnail || '';

        if (result && (result.status === true || result.status === "success" || mediaUrl)) {
            currentMediaUrl = mediaUrl;

            if (!currentMediaUrl) {
                throw new Error("URL media tidak ditemukan dalam respons server.");
            }

            viewArea.innerHTML = `
                <div class="p-4 text-center space-y-3">
                    <div class="rounded-xl overflow-hidden bg-black aspect-[16/9] max-h-[350px] mx-auto flex items-center justify-center">
                        <video src="${currentMediaUrl}" controls class="w-full h-full object-contain" poster="${thumbnailImg}"></video>
                    </div>
                    <p class="text-xs text-slate-600 font-medium">Facebook Video / Reels</p>
                </div>
            `;
            
            loadingBox.classList.add('hidden');
            previewContainer.classList.remove('hidden');
        } else {
            throw new Error(result?.message || "Gagal mengambil data, pastikan link publik.");
        }
    } catch (err) {
        loadingBox.classList.add('hidden');
        alert("Terjadi kesalahan: " + err.message);
    }
        }

        async function downloadMedia(fileUrl, filename, buttonElement) {
            const targetUrl = currentMediaUrl || fileUrl;
            if (!targetUrl) {
                alert("Link unduhan tidak tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menyimpan...`;

            try {
                const response = await fetch(targetUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = targetUrl;
                a.setAttribute('download', filename);
                a.setAttribute('target', '_blank');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2000);
            }
        }
        
        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      const colors = ['#3AAFA9', '#2B7A78', '#17252A'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 0.4 - (distance / 400);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
