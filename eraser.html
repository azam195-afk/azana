    <script>
        // --- NEURAL BACKGROUND SCRIPT (DARI PERMINTAAN) ---
        const bgCanvas = document.getElementById('neural-bg');
        const bgCtx = bgCanvas.getContext('2d');
        
        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', () => {
            resizeBgCanvas();
            initNodes();
        });
        
        resizeBgCanvas();

        const particlesArray = [];
        const colors = ['#00f2fe', '#bc13fe']; 

        class Particle {
            constructor() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() * 0.5) - 0.25;
                this.speedY = (Math.random() * 0.5) - 0.25;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > bgCanvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > bgCanvas.height) this.speedY *= -1;
            }
            draw() {
                bgCtx.fillStyle = this.color;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }

        function initNodes() {
            particlesArray.length = 0;
            let numberOfParticles = (bgCanvas.height * bgCanvas.width) / 9500;
            if (numberOfParticles > 130) numberOfParticles = 130;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateNodes() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        bgCtx.beginPath();
                        bgCtx.strokeStyle = particlesArray[i].color;
                        bgCtx.globalAlpha = 1 - (distance / 150);
                        bgCtx.lineWidth = 0.6;
                        bgCtx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        bgCtx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        bgCtx.stroke();
                        bgCtx.globalAlpha = 1;
                    }
                }
            }
            requestAnimationFrame(animateNodes);
        }

        window.onload = function() {
            initNodes();
            animateNodes();
        };

        // --- EDITOR LOGIC ---
        let CLIPDROP_API_KEY = window.AZANA_API_KEYS?.CLIPDROP || localStorage.getItem('AZANA_CLIPDROP_API_KEY') || '';
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const editorArea = document.getElementById('editor-area');
        const resultArea = document.getElementById('result-area');
        const resultImage = document.getElementById('result-image');
        const imgCanvas = document.getElementById('image-canvas');
        const drawCanvas = document.getElementById('draw-canvas');
        const loupeCanvas = document.getElementById('loupe-canvas');
        const magnifier = document.getElementById('magnifier');
        const ctxImg = imgCanvas.getContext('2d');
        const ctxDraw = drawCanvas.getContext('2d', { willReadFrequently: true });
        const ctxLoupe = loupeCanvas.getContext('2d');
        const brushSizeInput = document.getElementById('brush-size');
        const btnClear = document.getElementById('btn-clear');
        const btnUndo = document.getElementById('btn-undo');
        const btnProcess = document.getElementById('btn-process');
        
        let isDrawing = false;
        let imageObj = new Image();
        let hue = 180; let hueDirection = 1;
        let brushHistory = [];

        function loadImageFile(file) {
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('File harus berupa gambar.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (event) => {
                imageObj.onload = () => {
                    uploadArea.classList.add('hidden');
                    editorArea.classList.remove('hidden');
                    editorArea.classList.add('flex');
                    setTimeout(setupCanvas, 100);
                };
                imageObj.src = event.target.result;
            };
            reader.readAsDataURL(file);
                    }

        fileInput.addEventListener('change', (e) => loadImageFile(e.target.files[0]));

        uploadArea.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                fileInput.click();
            }
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (event) => {
                event.preventDefault();
                uploadArea.classList.add('border-neon-cyan', 'bg-neon-cyan/5');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (event) => {
                event.preventDefault();
                uploadArea.classList.remove('border-neon-cyan', 'bg-neon-cyan/5');
            });
        });

        uploadArea.addEventListener('drop', (event) => {
            const file = event.dataTransfer?.files?.[0];
            if (file) loadImageFile(file);
        });

        function setupCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const maxWidth = wrapper.parentElement.clientWidth - 40; 
            const scale = Math.min(1, maxWidth / imageObj.width);
            const w = imageObj.width * scale;
            const h = imageObj.height * scale;
            
            imgCanvas.width = w; imgCanvas.height = h;
            ctxImg.drawImage(imageObj, 0, 0, w, h);
            
            drawCanvas.width = w; drawCanvas.height = h;
            ctxDraw.lineCap = 'round'; ctxDraw.lineJoin = 'round';
            
            brushHistory = []; saveState();
        }

        function getPos(evt) {
            const rect = drawCanvas.getBoundingClientRect();
            let clientX, clientY;
            if (evt.touches && evt.touches.length > 0) { 
                clientX = evt.touches[0].clientX; 
                clientY = evt.touches[0].clientY; 
            } else { 
                clientX = evt.clientX; 
                clientY = evt.clientY; 
            }
            return {
                canvasX: (clientX - rect.left) * (drawCanvas.width / rect.width),
                canvasY: (clientY - rect.top) * (drawCanvas.height / rect.height),
                screenX: clientX, screenY: clientY
            };
        }

        function saveState() {
            if (brushHistory.length > 20) brushHistory.shift(); 
            brushHistory.push(ctxDraw.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
        }

        btnUndo.addEventListener('click', () => {
            if (brushHistory.length > 1) { brushHistory.pop(); ctxDraw.putImageData(brushHistory[brushHistory.length - 1], 0, 0); }
        });

        btnClear.addEventListener('click', () => {
            ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            saveState();
        });

        function updateMagnifier(pos) {
            const zoom = 2; const loupeSize = 110;
            magnifier.style.left = pos.screenX + 'px'; magnifier.style.top = pos.screenY + 'px';
            const srcX = pos.canvasX - (loupeSize / zoom / 2);
            const srcY = pos.canvasY - (loupeSize / zoom / 2);
            const srcW = loupeSize / zoom; const srcH = loupeSize / zoom;
            ctxLoupe.clearRect(0, 0, loupeSize, loupeSize);
            ctxLoupe.drawImage(imgCanvas, srcX, srcY, srcW, srcH, 0, 0, loupeSize, loupeSize);
            ctxLoupe.drawImage(drawCanvas, srcX, srcY, srcW, srcH, 0, 0, loupeSize, loupeSize);
        }

        function startPosition(e) { 
            e.preventDefault(); 
            isDrawing = true; 
            magnifier.classList.remove('hidden'); 
            const pos = getPos(e);
            ctxDraw.beginPath();
            ctxDraw.moveTo(pos.canvasX, pos.canvasY);
            draw(e); 
        }

        function endPosition(e) { 
            if (!isDrawing) return;
            isDrawing = false; 
            magnifier.classList.add('hidden'); 
            saveState(); 
        }

        function draw(e) {
            if (!isDrawing) return; 
            e.preventDefault();
            const pos = getPos(e);
            
            hue += hueDirection * 2; if(hue >= 300 || hue <= 180) hueDirection *= -1;
            ctxDraw.strokeStyle = `hsl(${hue}, 100%, 60%)`; 
            ctxDraw.lineWidth = brushSizeInput.value;
            
            ctxDraw.lineTo(pos.canvasX, pos.canvasY); 
            ctxDraw.stroke();
            updateMagnifier(pos);
        }

        drawCanvas.addEventListener('mousedown', startPosition); 
        drawCanvas.addEventListener('mouseup', endPosition);
        drawCanvas.addEventListener('mousemove', draw); 
        drawCanvas.addEventListener('mouseleave', endPosition);
        drawCanvas.addEventListener('touchstart', startPosition, { passive: false }); 
        drawCanvas.addEventListener('touchend', endPosition, { passive: false });
        drawCanvas.addEventListener('touchmove', draw, { passive: false });

        btnProcess.addEventListener('click', async () => {
            btnProcess.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>MENGHAPUS...';
            btnProcess.disabled = true;
            try {
                if (!CLIPDROP_API_KEY) {
                    throw new Error('API key Clipdrop belum dikonfigurasi oleh admin.');
                }
                const imageBlob = await new Promise(resolve => imgCanvas.toBlob(resolve, 'image/jpeg', 0.95));
                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = drawCanvas.width; maskCanvas.height = drawCanvas.height;
                const maskCtx = maskCanvas.getContext('2d');
                maskCtx.fillStyle = "black";
                maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
                maskCtx.drawImage(drawCanvas, 0, 0);
                const imgData = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    if (imgData.data[i] > 0 || imgData.data[i+1] > 0 || imgData.data[i+2] > 0) {
                        imgData.data[i] = 255; imgData.data[i+1] = 255; imgData.data[i+2] = 255; imgData.data[i+3] = 255;
                    }
                }
                maskCtx.putImageData(imgData, 0, 0);
                const maskBlob = await new Promise(resolve => maskCanvas.toBlob(resolve, 'image/png'));
                const formData = new FormData();
                formData.append('image_file', imageBlob);
                formData.append('mask_file', maskBlob);
                const response = await fetch('https://clipdrop-api.co/cleanup/v1', {
                    method: 'POST',
                    headers: { 'x-api-key': CLIPDROP_API_KEY },
                    body: formData
                });
                if (!response.ok) throw new Error("Gagal memproses gambar. Pastikan kuota API masih ada.");
                const resultBlob = await response.blob();
                const resultUrl = URL.createObjectURL(resultBlob);
                resultImage.src = resultUrl;
                document.getElementById('btn-download').href = resultUrl;
                resultArea.classList.remove('hidden');
                resultArea.classList.add('flex');
                resultArea.scrollIntoView({ behavior: 'smooth' });
            } catch (error) { alert(error.message); } 
            finally { btnProcess.innerHTML = '<i class="fas fa-magic mr-2"></i>Hapus Objek'; btnProcess.disabled = false; }
        });
    </script>
