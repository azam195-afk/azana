<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZANA Studio Pro - HD Texture Recovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], tech: ['Rajdhani', 'sans-serif'] },
                    colors: { neon: { cyan: '#00f2fe', purple: '#bc13fe' }, dark: { 950: '#050508', 900: '#0a0a14', 800: '#13131a', 700: '#1c1c26' } }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #050508; 
            color: #cbd5e1; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* NEURAL BACKGROUND CANVAS */
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
            opacity: 0.8;
            pointer-events: none;
        }

        /* EFEK CAHAYA NEON HALUS DI POJOK */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 10%, rgba(188, 19, 254, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.15) 0%, transparent 45%);
            z-index: 1;
            filter: blur(80px);
            pointer-events: none;
        }

        /* KOTAK 1:1 BENING TOTAL (TRANSPARAN KRISTAL) */
        .crystal-box { 
            background: transparent !important;
            border: 2px dashed rgba(0, 242, 254, 0.3);
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 2.5rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(4px);
        }

        .crystal-box:hover {
            border-color: #bc13fe;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.2);
            transform: scale(1.02);
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #00f2fe; box-shadow: 0 0 15px #00f2fe;
            animation: scan 2s infinite linear; z-index: 10; display: none;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        .safe-italic { padding-right: 0.3em; display: inline-block; }
    </style>
</head>
<body>

    <!-- NEURAL ENGINE -->
    <canvas id="neural-bg"></canvas>

    <div class="flex-grow flex flex-col items-center p-6 w-full relative z-10">
        
        <header class="text-center w-full max-w-3xl mt-12 mb-10 flex flex-col items-center">
            <div class="w-14 h-14 rounded-2xl bg-dark-900/60 border border-neon-cyan/30 flex items-center justify-center text-neon-cyan shadow-[0_0_20px_rgba(0,242,254,0.2)] mb-3 animate-pulse">
                <i class="fas fa-layer-group text-3xl"></i>
            </div>
            <h1 class="text-3xl md:text-6xl font-tech font-bold text-white tracking-widest uppercase italic leading-tight">
                AZANA <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-neon-purple safe-italic">TEXTURE PRO</span>
            </h1>
            <p class="text-slate-500 text-[10px] md:text-xs max-w-xl mx-auto mt-4 opacity-70 uppercase tracking-[0.4em] font-tech font-bold">
                Neural Image Reconstruction System v3.0
            </p>
        </header>

        <main class="w-full flex flex-col items-center">
            <!-- BOX UPLOAD: 1:1 & BENING TOTAL -->
            <div id="upload-area" onclick="document.getElementById('file-input').click()" class="crystal-box group cursor-pointer">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <div class="pointer-events-none flex flex-col items-center">
                    <div class="w-20 h-20 bg-neon-cyan/10 rounded-3xl flex items-center justify-center mb-8 text-4xl text-neon-cyan group-hover:text-neon-purple transition-all duration-700 border border-neon-cyan/20 shadow-[0_0_20px_rgba(0,242,254,0.1)]">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2 font-tech uppercase tracking-[0.2em]">Pilih Foto Anda</h3>
                    <p class="text-slate-500 text-[10px] font-tech tracking-widest uppercase opacity-60">Klik Untuk Mulai Mengedit</p>
                </div>
            </div>

            <!-- AREA PROSES -->
            <div id="processing-area" class="hidden crystal-box overflow-hidden relative">
                <div class="scan-line" id="scan-effect" style="display:block"></div>
                <img id="preview-image" src="" class="absolute inset-0 w-full h-full object-cover opacity-10 blur-sm">
                <div class="z-10 flex flex-col items-center gap-6">
                    <i class="fas fa-atom fa-spin text-neon-cyan text-5xl mb-2"></i>
                    <span class="font-tech text-white tracking-[0.5em] text-xs uppercase italic">Processing Neural...</span>
                    <div class="w-48 bg-dark-800 rounded-full h-1 mt-2 overflow-hidden border border-white/5">
                        <div id="progress-bar" class="bg-gradient-to-r from-neon-purple to-neon-cyan h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <!-- AREA HASIL -->
            <div id="result-area" class="hidden flex-col gap-8 w-full max-w-[340px] animate-in fade-in duration-1000">
                <div class="crystal-box p-4 border-solid border-neon-cyan/30">
                    <img id="result-enhanced" src="" class="w-full h-full object-contain drop-shadow-2xl rounded-2xl">
                </div>
                
                <div class="flex flex-col gap-4">
                    <a id="download-btn" href="#" download="AZANA_TEXTURE_HD.jpg" class="w-full bg-gradient-to-r from-neon-purple to-neon-cyan text-white font-bold py-5 rounded-2xl shadow-[0_10px_40px_rgba(188,19,254,0.4)] hover:scale-105 transition-all flex items-center justify-center gap-4 font-tech tracking-[0.2em] text-sm uppercase">
                        <i class="fas fa-download"></i> SIMPAN GAMBAR HD
                    </a>
                    <button onclick="location.reload()" class="text-slate-500 hover:text-white font-tech tracking-widest uppercase text-[9px] transition-all py-3 font-bold">
                        <i class="fas fa-redo-alt mr-2"></i> COBA FOTO LAIN
                    </button>
                </div>
            </div>
        </main>
    </div>

<div id="footer"></div>

<script>
fetch('components/footer-ai.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('footer').innerHTML = data;
  });
</script>
    
    <!-- SCRIPT NEURAL ENGINE (DARI FILE CONTOH LU) -->
    <script>
        const canvas = document.getElementById('neural-bg');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
        resizeCanvas();
        const particlesArray = [];
        const colors = ['#00f2fe', '#bc13fe'];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() * 0.5) - 0.25;
                this.speedY = (Math.random() * 0.5) - 0.25;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initNodes() {
            particlesArray.length = 0;
            let numberOfParticles = (canvas.height * canvas.width) / 9500;
            if (numberOfParticles > 130) numberOfParticles = 130;
            for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
        }
        function animateNodes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
                        ctx.globalAlpha = 1 - (distance / 150);
                        ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
                    }
                }
            }
            requestAnimationFrame(animateNodes);
        }
        window.onload = function() { initNodes(); animateNodes(); };

        /* LOGIKA TEXTURE PRO TETAP */
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const processingArea = document.getElementById('processing-area');
        const resultArea = document.getElementById('result-area');
        const progressBar = document.getElementById('progress-bar');

        fileInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('preview-image').src = ev.target.result;
                    uploadArea.classList.add('hidden');
                    processingArea.classList.remove('hidden');
                    processingArea.classList.add('flex');
                    prosesRecovery(ev.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function prosesRecovery(dataUrl) {
            let progress = 0;
            const interval = setInterval(() => { if(progress < 90) { progress += 10; progressBar.style.width = progress + '%'; } }, 500);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width; canvas.height = img.height;
                ctx.filter = 'contrast(1.1) saturate(1.1) brightness(1.02)';
                ctx.drawImage(img, 0, 0);
                const final = canvas.toDataURL('image/jpeg', 0.9);
                clearInterval(interval);
                progressBar.style.width = '100%';
                setTimeout(() => {
                    processingArea.classList.remove('flex'); processingArea.classList.add('hidden');
                    resultArea.classList.remove('hidden'); resultArea.classList.add('flex');
                    document.getElementById('result-enhanced').src = final;
                    document.getElementById('download-btn').href = final;
                }, 1000);
            };
            img.src = dataUrl;
        }
    </script>
</body>
  </html>
