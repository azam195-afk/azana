<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Enhancer / Penjernih Foto - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #FEFFFF !important;
            color: #17252A !important;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(145deg, rgba(222, 242, 241, 0.95), rgba(254, 255, 255, 0.98)) !important;
            border: 1px solid rgba(58, 175, 169, 0.3) !important;
            box-shadow: 0 10px 35px 0 rgba(58, 175, 169, 0.15) !important;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-slate-200 relative z-10 bg-[#FEFFFF]/90 backdrop-blur-md">
        <a href="index.html" class="text-azana-tealDark hover:text-azana-teal transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-azana-tealDark uppercase font-bold">STUDIO VISUAL (ENHANCER)</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-[#DEF2F1] border border-[#3AAFA9]/40 flex items-center justify-center text-[#2B7A78] text-2xl shadow-[0_0_15px_rgba(58,175,169,0.25)]">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1 text-[#17252A]">PENJERNIH FOTO</h1>
                <p class="text-[11px] text-slate-600">Tingkatkan resolusi dan kejernihan foto dengan AI.</p>
            </div>

            <!-- Upload & Proses Form -->
            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="file" id="image-file" accept="image/*" 
                        class="w-full bg-white border border-slate-300 rounded-2xl py-2.5 px-3 text-xs text-slate-700 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#DEF2F1] file:text-[#2B7A78] hover:file:bg-[#3AAFA9]/20 transition shadow-sm">
                </div>
                <button onclick="processEnhance()" id="btn-process" 
                    class="w-full py-3 rounded-2xl font-bold text-xs bg-gradient-to-r from-[#3AAFA9] to-[#2B7A78] hover:opacity-90 text-white shadow-md shadow-[#3AAFA9]/30 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-magic"></i> Proses Jernihkan Foto
                </button>
            </div>

            <!-- Loading Box -->
            <div id="loading-box" class="hidden text-center py-6 text-[#2B7A78] text-xs font-semibold">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> AI sedang memproses dan menjernihkan foto...
            </div>

            <!-- PREVIEW & HASIL CONTAINER -->
            <div id="preview-container" class="hidden space-y-4 pt-2">
                <div class="space-y-3 text-center">
                    <div class="rounded-xl overflow-hidden bg-white aspect-auto max-h-[260px] mx-auto flex items-center justify-center border border-slate-300 shadow-inner p-2">
                        <img id="result-image" src="" class="w-full h-full object-contain rounded-lg" alt="Hasil Penjernihan">
                    </div>
                </div>

                <div class="space-y-2.5">
                    <button onclick="downloadResult()" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-[#3AAFA9] hover:bg-[#2B7A78] text-white font-bold text-xs rounded-xl transition shadow cursor-pointer">
                        <i class="fa-solid fa-download"></i> Download Foto Jernih
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div id="footer" class="relative z-10"></div>

    <script src="asset/js/all-tools-api.js"></script>
    <script>
        let enhancedImageUrl = "";

        async function processEnhance() {
            const fileInput = document.getElementById('image-file');
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (fileInput.files.length === 0) {
                alert('Pilih foto terlebih dahulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                // Memanggil fungsi API penjernih dari library all-tools-api.js
                const result = await enhancePhoto(fileInput.files[0]);
                
                if (result && (result.status === "success" || result.url)) {
                    enhancedImageUrl = result.url || result.result_url;
                    document.getElementById('result-image').src = enhancedImageUrl;
                    
                    loadingBox.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                } else {
                    throw new Error(result?.message || "Gagal memproses gambar.");
                }
            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        function downloadResult() {
            if (!enhancedImageUrl) {
                alert("Foto hasil belum tersedia!");
                return;
            }
            const a = document.createElement('a');
            a.href = enhancedImageUrl;
            a.download = 'azana_enhanced_photo.jpg';
            a.setAttribute('target', '_blank');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      const colors = ['#3AAFA9', '#2B7A78', '#17252A'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 0.4 - (distance / 400);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
