    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      // Neural background disesuaikan warna hijau tosca khas Azana
      const colors = ['#3AAFA9', '#2B7A78', '#17252A'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 0.4 - (distance / 400);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };

      /* LOGIKA TEXTURE PRO TETAP UTUH 100% */
      const fileInput = document.getElementById('file-input');
      const uploadArea = document.getElementById('upload-area');
      const processingArea = document.getElementById('processing-area');
      const resultArea = document.getElementById('result-area');
      const progressBar = document.getElementById('progress-bar');

      function loadImageFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('File harus berupa gambar.');
          return;
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          document.getElementById('preview-image').src = ev.target.result;
          uploadArea.classList.add('hidden');
          processingArea.classList.remove('hidden');
          processingArea.classList.add('flex');
          prosesRecovery(ev.target.result);
        };
        reader.readAsDataURL(file);
      }

      fileInput.addEventListener('change', (e) => loadImageFile(e.target.files[0]));

      uploadArea.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          fileInput.click();
        }
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        uploadArea.addEventListener(eventName, (event) => {
          event.preventDefault();
          uploadArea.classList.add('border-[#2B7A78]', 'shadow-[0_0_30px_rgba(58,175,169,0.3)]');
        });
      });

      ['dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, (event) => {
          event.preventDefault();
          uploadArea.classList.remove('border-[#2B7A78]', 'shadow-[0_0_30px_rgba(58,175,169,0.3)]');
        });
      });

      uploadArea.addEventListener('drop', (event) => {
        const file = event.dataTransfer?.files?.[0];
        if (file) loadImageFile(file);
      });

      function prosesRecovery(dataUrl) {
        let progress = 0;
        const interval = setInterval(() => { if(progress < 90) { progress += 10; progressBar.style.width = progress + '%'; } }, 500);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width; canvas.height = img.height;
          ctx.filter = 'contrast(1.1) saturate(1.1) brightness(1.02)';
          ctx.drawImage(img, 0, 0);
          const final = canvas.toDataURL('image/jpeg', 0.9);
          clearInterval(interval);
          progressBar.style.width = '100%';
          setTimeout(() => {
            processingArea.classList.remove('flex'); processingArea.classList.add('hidden');
            resultArea.classList.remove('hidden'); resultArea.classList.add('flex');
            document.getElementById('result-enhanced').src = final;
            document.getElementById('download-btn').href = final;
          }, 1000);
        };
        img.src = dataUrl;
      }
    </script>
