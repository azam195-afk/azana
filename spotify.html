    <script>
      tailwind.config = {

            colors: { neon: { cyan: '#00f2fe', purple: '#bc13fe', emerald: '#34d399' }, dark: { 950: '#070708', 900: '#0a0a0f', 800: '#13131a', 700: '#1c1c26' } }
          }

    <style>
      body {
        background-color: #050508;
        color: #cbd5e1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        margin: 0;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
        radial-gradient(circle at 10% 10%, rgba(52, 211, 153, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.1) 0%, transparent 45%);
        z-index: -1;
        filter: blur(80px);
        pointer-events: none;
      }

      #neural-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        display: block;
        opacity: 0.7;
      }

      .safe-italic {
        padding-right: 0.3em;
        display: inline-block;
      }

      @keyframes border-glow {

        50% { border-color: rgba(52, 211, 153, 0.4); }
        100% { border-color: rgba(52, 211, 153, 0.1); }
      }
      .animate-border {
        animation: border-glow 4s infinite ease-in-out;
      }
    </style>
  </head>
  <body>

    <!-- LAYER NEURAL BACKGROUND -->
    <canvas id="neural-bg"></canvas>

    <div class="flex-grow flex flex-col items-center p-6 w-full relative z-10">

      <!-- TOMBOL KEMBALI -->
      <div class="w-full max-w-xl mb-4">
        <a href="index.html" class="inline-flex items-center gap-2 text-xs font-tech tracking-widest uppercase text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-4 py-2 rounded-xl backdrop-blur-md hover:bg-emerald-500/20 transition-all">
          <i class="fas fa-arrow-left"></i> Kembali ke Menu
        </a>
      </div>

      <header class="text-center w-full max-w-xl mb-8 flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-dark-900/30 backdrop-blur-md border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-4 shadow-lg">
          <i class="fab fa-spotify text-xl"></i>
        </div>

        <h1 class="text-2xl md:text-4xl font-tech font-bold text-white tracking-[0.2em] uppercase italic leading-tight">
          AZANA <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-neon-cyan safe-italic">SPOTIFY DOWNLOADER</span>
        </h1>

        <p class="text-slate-500 text-[10px] md:text-xs max-w-xs mx-auto mt-4 opacity-70 uppercase tracking-[0.3em] font-tech font-semibold">
          Unduh musik favorit dari Spotify secara cepat & instan.
        </p>
      </header>

      <main class="w-full max-w-xl">
        <!-- Kotak Input Form -->
        <div class="bg-dark-800/60 backdrop-blur-xl p-6 rounded-3xl border border-emerald-500/20 shadow-2xl animate-border mb-6">
          <div class="flex flex-col gap-4">
            <label for="url-input" class="text-xs font-tech tracking-widest text-emerald-400 uppercase">Tautan Spotify (Lagu / Track)</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-emerald-400">
                <i class="fas fa-link"></i>
              </span>
              <input type="text" id="url-input" placeholder="https://open.spotify.com/track/..." 
              class="w-full bg-dark-900/80 border border-white/10 rounded-xl py-3.5 pl-11 pr-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500/60 font-sans">
            </div>
            <button onclick="prosesSpotify()" id="submit-btn" class="w-full bg-gradient-to-r from-emerald-500 to-neon-cyan text-dark-950 font-bold py-4 rounded-xl shadow-lg hover:scale-[1.01] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 font-tech tracking-[0.2em] text-xs uppercase italic">
              <i class="fas fa-download"></i> Unduh Musik
            </button>
          </div>
        </div>

        <!-- Processing Area (Loading) -->
        <div id="processing-area" class="hidden flex-col items-center justify-center p-8 bg-dark-800/40 backdrop-blur-xl rounded-3xl border border-white/5 mb-6">
          <i class="fas fa-circle-notch fa-spin text-emerald-400 text-3xl mb-4"></i>
          <span class="font-tech text-white tracking-[0.3em] text-[10px] uppercase italic" id="status-text">Mengambil data musik dari Spotify...</span>
          <div class="w-full bg-white/5 rounded-full h-0.5 overflow-hidden mt-4">
            <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-neon-cyan h-full w-0 transition-all duration-500"></div>
          </div>
        </div>

        <!-- Result Area -->
        <div id="result-area" class="hidden flex-col items-center w-full bg-dark-800/60 backdrop-blur-xl p-6 rounded-3xl border border-emerald-500/30 shadow-2xl">
          <div class="flex flex-col md:flex-row items-center gap-4 w-full mb-6">
            <img id="result-thumb" src="" class="w-28 h-28 object-cover rounded-2xl border border-emerald-500/30 shadow-md" alt="Cover Lagu">
            <div class="flex flex-col text-center md:text-left flex-grow">
              <span class="text-[8px] font-tech text-emerald-400 tracking-widest uppercase mb-1">Berhasil Diproses</span>
              <h3 id="result-title" class="text-sm md:text-base font-bold text-white uppercase tracking-wider mb-1">Judul Lagu</h3>
              <p id="result-artist" class="text-xs text-slate-400 font-sans">Artis / Penyanyi</p>
            </div>
          </div>

          <div class="flex flex-col gap-3 w-full">
            <a id="download-btn" href="#" target="_blank" class="w-full bg-gradient-to-r from-emerald-500 to-neon-cyan text-dark-950 font-bold py-4 rounded-xl shadow-lg hover:scale-[1.01] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 font-tech tracking-[0.2em] text-xs uppercase italic">
              <i class="fas fa-file-audio"></i> SIMPAN MP3 SEKARANG
            </a>
            <button onclick="location.reload()" class="w-full text-slate-500 hover:text-white text-[9px] font-tech tracking-[0.25em] uppercase bg-white/[0.03] py-3.5 rounded-xl border border-white/5 transition-all">
              Unduh Lagu Lain
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script>
      fetch('components/footer-ai.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer').innerHTML = data;
      });
    </script>

    <script>
      // --- ANIMASI NEURAL BACKGROUND ---
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        initNodes();
      });

      resizeCanvas();

      const particlesArray = [];
      const colors = ['#34d399', '#00f2fe'];

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) {
          particlesArray.push(new Particle());
        }
      }

      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath();
              ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 1 - (distance / 150);
              ctx.lineWidth = 0.6;
              ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
              ctx.stroke();
              ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }

      window.onload = function() {
        initNodes();
        animateNodes();
      };

      // --- LOGIKA SPOTIFY DOWNLOADER ---
      async function prosesSpotify() {
        const urlInput = document.getElementById('url-input').value.trim();
        if (!urlInput) {
          alert('Sila masukkan pautan Spotify terlebih dahulu.');
          return;
        }

        const processingArea = document.getElementById('processing-area');
        const resultArea = document.getElementById('result-area');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        processingArea.classList.remove('hidden');
        processingArea.classList.add('flex');
        
        let progress = 0;
        const interval = setInterval(() => {
          if (progress < 90) {
            progress += 5;
            progressBar.style.width = progress + '%';
          }
        }, 150);

        try {
          statusText.innerText = "Menghubungkan ke peladen Spotify...";
          const res = await fetch(`https://api.nexray.eu.cc/downloader/spotify?url=${encodeURIComponent(urlInput)}`);
          
          if (!res.ok) throw new Error("Gagal mengambil data dari endpoint Spotify.");
          const data = await res.json();

          clearInterval(interval);
          progressBar.style.width = '100%';
          statusText.innerText = "SELESAI!";

           // Menyesuaikan struktur data hasil respons Nexray Spotify Downloader
          const info = data.data || data.result || data;
          const title = info.title || info.name || "Lagu Spotify";
          const artist = info.artist || info.authors || "Artis Tidak Diketahui";
          const thumb = info.thumbnail || info.image || "https://azana.my.id/asset/img/globe.png";
          const downloadUrl = info.download || info.url || info.audio;
          
          if (!downloadUrl) throw new Error("Pautan unduhan fail audio tidak ditemui.");

          setTimeout(() => {
            processingArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
            resultArea.classList.add('flex');

            document.getElementById('result-title').innerText = title;
            document.getElementById('result-artist').innerText = artist;
            document.getElementById('result-thumb').src = thumb;
            document.getElementById('download-btn').href = downloadUrl;
          }, 500);

        } catch (err) {
          clearInterval(interval);
          processingArea.classList.add('hidden');
          alert("Ralat: " + err.message);
        }
      }
    </script>
  </body>
</html>
