<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #FEFFFF !important;
            color: #17252A !important;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(145deg, rgba(222, 242, 241, 0.95), rgba(254, 255, 255, 0.98)) !important;
            border: 1px solid rgba(58, 175, 169, 0.3) !important;
            box-shadow: 0 10px 35px 0 rgba(58, 175, 169, 0.15) !important;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-slate-200 relative z-10 bg-[#FEFFFF]/90 backdrop-blur-md">
        <a href="index.html" class="text-azana-tealDark hover:text-azana-teal transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-azana-tealDark uppercase font-bold">SPOTIFY ROOM (MP3)</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-[#DEF2F1] border border-[#3AAFA9]/40 flex items-center justify-center text-[#2B7A78] text-2xl shadow-[0_0_15px_rgba(58,175,169,0.25)]">
                    <i class="fa-brands fa-spotify"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1 text-[#17252A]">SPOTIFY DOWNLOADER</h1>
                <p class="text-[11px] text-slate-600">Download lagu MP3 dari Spotify secara instan.</p>
            </div>

            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="text" id="spotify-url" placeholder="Tempel link track Spotify di sini..." 
                        class="w-full bg-white border border-slate-300 rounded-2xl py-3 px-4 text-xs text-[#17252A] placeholder-slate-400 focus:outline-none focus:border-[#3AAFA9] transition shadow-sm">
                </div>
                <button onclick="processSpotifyDownload()" id="btn-process" 
                    class="w-full py-3 rounded-2xl font-bold text-xs bg-gradient-to-r from-[#3AAFA9] to-[#2B7A78] hover:opacity-90 text-white shadow-md shadow-[#3AAFA9]/30 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-bolt"></i> Ambil Info Musik
                </button>
            </div>

            <div id="loading-box" class="hidden text-center py-6 text-[#2B7A78] text-xs font-semibold">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil informasi lagu dari Spotify API...
            </div>

            <div id="preview-container" class="hidden space-y-4 pt-2">
                
                <div class="space-y-3 text-center">
                    <div class="rounded-xl overflow-hidden bg-black aspect-square max-h-[160px] mx-auto flex items-center justify-center border border-slate-300 shadow-inner">
                        <img id="track-thumbnail" src="" class="w-full h-full object-cover" alt="Thumbnail">
                    </div>
                    <div class="bg-white/90 border border-slate-200 rounded-2xl p-3 text-left shadow-sm">
                        <span class="text-[10px] text-slate-500 font-semibold uppercase">Judul & Artis:</span>
                        <p id="track-title" class="text-xs text-slate-800 line-clamp-1 mt-0.5 font-bold">-</p>
                        <p id="track-artist" class="text-[11px] text-[#2B7A78] font-medium">-</p>
                    </div>
                </div>

                <div id="content-mp3" class="space-y-2.5">
                    <div class="bg-white/90 border border-slate-200 rounded-2xl p-3 flex items-center justify-between shadow-sm">
                        <div>
                            <p class="text-xs font-bold text-[#2B7A78]"><i class="fa-solid fa-music mr-1"></i> Audio MP3</p>
                            <span class="text-[10px] text-slate-500">Kualitas Tinggi (High Quality)</span>
                        </div>
                        <button onclick="downloadMedia(audioDownloadUrl, this)" class="bg-[#3AAFA9] hover:bg-[#2B7A78] text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow cursor-pointer">
                            ↓ Download MP3
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <div id="footer" class="relative z-10"></div>

    <script>
        let audioDownloadUrl = "";
        let musicTitle = "spotify_audio";

        async function processSpotifyDownload() {
            const urlInput = document.getElementById('spotify-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (!urlInput) {
                alert('Masukkan link Spotify dulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                const res = await fetch(`https://api.nexray.eu.cc/downloader/spotify?url=${encodeURIComponent(urlInput)}`).then(r => r.json()).catch(() => null);

                let title = "Lagu Spotify";
                let artist = "Artis Tidak Diketahui";
                let thumbnail = "https://azana.my.id/asset/img/globe.png";

                if (res && (res.status === true || res.data || res.result)) {
                    const info = res.data || res.result || res;
                    if (info.download || info.url || info.audio) {
                        audioDownloadUrl = info.download || info.url || info.audio;
                    }
                    if (info.title || info.name) title = info.title || info.name;
                    if (info.artist || info.authors) artist = info.artist || info.authors;
                    if (info.thumbnail || info.image || info.cover) thumbnail = info.thumbnail || info.image || info.cover;
                }

                if (!audioDownloadUrl) {
                    throw new Error("Gagal mendapatkan link unduhan audio dari API.");
                }

                musicTitle = (title + " - " + artist).replace(/[\/\\?%*:|"<>]/g, '');
                document.getElementById('track-title').innerText = title;
                document.getElementById('track-artist').innerText = artist;
                document.getElementById('track-thumbnail').src = thumbnail;

                loadingBox.classList.add('hidden');
                previewContainer.classList.remove('hidden');

            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        async function downloadMedia(fileUrl, buttonElement) {
            if (!fileUrl) {
                alert("Link unduhan audio belum tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengunduh...`;

            try {
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = musicTitle + '.mp3';
                a.setAttribute('download', musicTitle + '.mp3');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (err) {
                window.open(fileUrl, '_blank');
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2000);
            }
        }

        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      // Neural background disesuaikan warna hijau tosca khas Azana
      const colors = ['#3AAFA9', '#2B7A78', '#17252A'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 0.4 - (distance / 400);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
