<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZANA Studio Pro - Text to Image Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], tech: ['Rajdhani', 'sans-serif'] },
                    colors: { neon: { cyan: '#00f2fe', purple: '#bc13fe' }, dark: { 950: '#050508', 900: '#0a0a14', 800: '#13131a', 700: '#1c1c26' } }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #050508; 
            color: #cbd5e1; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* NEURAL BACKGROUND CANVAS */
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: block;
            opacity: 0.8;
            pointer-events: none;
        }

        /* EFEK CAHAYA NEON HALUS */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 10%, rgba(188, 19, 254, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.15) 0%, transparent 45%);
            z-index: 1;
            filter: blur(80px);
            pointer-events: none;
        }

        /* CRYSTAL BOX 1:1 */
        .crystal-box { 
            background: transparent !important;
            border: 2px dashed rgba(0, 242, 254, 0.3);
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 2.5rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(8px);
            padding: 20px;
        }

        .crystal-box:focus-within, .crystal-box:hover {
            border-color: #bc13fe;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.2);
            transform: scale(1.01);
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #00f2fe; box-shadow: 0 0 15px #00f2fe;
            animation: scan 2s infinite linear; z-index: 10; display: none;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        .safe-italic { padding-right: 0.3em; display: inline-block; }

        textarea {
            background: rgba(10, 10, 20, 0.5) !important;
            scrollbar-width: none;
        }
        textarea::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- NEURAL ENGINE BACKGROUND -->
    <canvas id="neural-bg"></canvas>

    <div class="flex-grow flex flex-col items-center p-6 w-full relative z-10">
        
        <header class="text-center w-full max-w-3xl mt-12 mb-10 flex flex-col items-center">
            <div class="w-14 h-14 rounded-2xl bg-dark-900/60 border border-neon-cyan/30 flex items-center justify-center text-neon-cyan shadow-[0_0_20px_rgba(0,242,254,0.2)] mb-3 animate-pulse">
                <i class="fas fa-microchip text-3xl"></i>
            </div>
            <h1 class="text-3xl md:text-6xl font-tech font-bold text-white tracking-widest uppercase italic leading-tight">
                AZANA <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-cyan to-neon-purple safe-italic">NEURAL GEN</span>
            </h1>
            <p class="text-slate-500 text-[10px] md:text-xs max-w-xl mx-auto mt-4 opacity-70 uppercase tracking-[0.4em] font-tech font-bold">
                Neural Image Synthesis System v4.0
            </p>
        </header>

        <main class="w-full flex flex-col items-center gap-8">
            <!-- INPUT AREA -->
            <div id="input-container" class="crystal-box group overflow-hidden">
                <div class="w-full h-full flex flex-col items-center justify-center">
                    <span class="w-16 h-16 bg-neon-cyan/10 rounded-2xl flex items-center justify-center mb-6 text-3xl text-neon-cyan border border-neon-cyan/20">
                        <i class="fas fa-terminal"></i>
                    </span>
                    <h2 class="text-lg font-bold text-white mb-4 font-tech uppercase tracking-[0.2em]">Input Prompt</h2>
                    <textarea id="prompt-input" 
                        class="w-full flex-grow border-none outline-none text-slate-200 p-4 rounded-xl font-tech tracking-wider resize-none text-center"
                        placeholder="Contoh: Kucing cyberpunk di Jakarta tahun 2077..."></textarea>
                    
                    <button id="generate-btn" onclick="generateAction()" 
                        class="mt-6 w-full py-4 bg-white/5 hover:bg-neon-cyan/20 border border-neon-cyan/30 text-neon-cyan font-bold rounded-2xl transition-all font-tech tracking-widest uppercase">
                        Mulai Sintesis
                    </button>
                </div>
            </div>

            <!-- PROCESSING AREA -->
            <div id="processing-area" class="hidden crystal-box overflow-hidden relative">
                <div class="scan-line" id="scan-effect" style="display:block"></div>
                <div class="z-10 flex flex-col items-center gap-6">
                    <i class="fas fa-spinner fa-spin text-neon-cyan text-5xl mb-2"></i>
                    <span class="font-tech text-white tracking-[0.5em] text-xs uppercase italic">Synthesizing Pixels...</span>
                    <div class="w-48 bg-dark-800 rounded-full h-1 mt-2 overflow-hidden border border-white/5">
                        <div id="progress-bar" class="bg-gradient-to-r from-neon-purple to-neon-cyan h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>

            <!-- RESULT AREA -->
            <div id="result-area" class="hidden flex-col gap-8 w-full max-w-[400px] animate-in fade-in duration-1000">
                <div class="crystal-box p-4 border-solid border-neon-cyan/30">
                    <img id="result-image" src="" class="w-full h-full object-contain drop-shadow-2xl rounded-2xl">
                </div>
                
                <div class="flex flex-col gap-4">
                    <a id="download-btn" href="#" download="AZANA_GEN_AI.png" class="w-full bg-gradient-to-r from-neon-purple to-neon-cyan text-white font-bold py-5 rounded-2xl shadow-[0_10px_40px_rgba(188,19,254,0.4)] hover:scale-105 transition-all flex items-center justify-center gap-4 font-tech tracking-[0.2em] text-sm uppercase">
                        <i class="fas fa-download"></i> Simpan Mahakarya
                    </a>
                    <button onclick="location.reload()" class="text-slate-500 hover:text-white font-tech tracking-widest uppercase text-[9px] transition-all py-3 font-bold">
                        <i class="fas fa-redo-alt mr-2"></i> Generate Lagi
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- FOOTER LOAD -->
    <div id="footer"></div>

    <script>
        // Memanggil footer sesuai request
        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(() => {
            // Fallback jika file tidak ditemukan saat testing
            document.getElementById('footer').innerHTML = `<footer class="p-10 text-center opacity-40 font-tech uppercase tracking-[0.3em] text-[10px]">© 2024 Azana Design - Neural Labs</footer>`;
        });
    </script>
    
    <!-- SCRIPT NEURAL ENGINE (Sama dengan penjernih.html) -->
    <script>
        const canvas = document.getElementById('neural-bg');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
        resizeCanvas();
        const particlesArray = [];
        const colors = ['#00f2fe', '#bc13fe'];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() * 0.5) - 0.25;
                this.speedY = (Math.random() * 0.5) - 0.25;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initNodes() {
            particlesArray.length = 0;
            let numberOfParticles = (canvas.height * canvas.width) / 9500;
            if (numberOfParticles > 130) numberOfParticles = 130;
            for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
        }
        function animateNodes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 150) {
                        ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
                        ctx.globalAlpha = 1 - (distance / 150);
                        ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
                    }
                }
            }
            requestAnimationFrame(animateNodes);
        }
        window.onload = function() { initNodes(); animateNodes(); };

        /* LOGIKA GEMINI IMAGEN 4.0 */
        const apiKey = ""; // Otomatis terisi
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;

        async function generateAction() {
            const prompt = document.getElementById('prompt-input').value.trim();
            if (!prompt) return alert("Neural prompt tidak boleh kosong!");

            // UI Switch
            document.getElementById('input-container').classList.add('hidden');
            const proc = document.getElementById('processing-area');
            proc.classList.remove('hidden');
            proc.classList.add('flex');

            let progress = 0;
            const pb = document.getElementById('progress-bar');
            const interval = setInterval(() => { if(progress < 90) { progress += 5; pb.style.width = progress + '%'; } }, 300);

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        instances: [{ prompt: prompt }],
                        parameters: { sampleCount: 1 }
                    })
                });

                const data = await response.json();

                if (data.predictions && data.predictions[0].bytesBase64Encoded) {
                    const base64 = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    clearInterval(interval);
                    pb.style.width = '100%';
                    
                    setTimeout(() => {
                        proc.classList.remove('flex');
                        proc.classList.add('hidden');
                        document.getElementById('result-area').classList.remove('hidden');
                        document.getElementById('result-area').classList.add('flex');
                        document.getElementById('result-image').src = base64;
                        document.getElementById('download-btn').href = base64;
                    }, 800);
                } else {
                    throw new Error("Empty Response");
                }
            } catch (err) {
                alert("Neural System Error. Coba prompt lain.");
                location.reload();
            }
        }
    </script>
</body>
</html>
