<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - Azana Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #neural-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .card-glow {
            background: linear-gradient(135deg, rgba(18, 24, 38, 0.95), rgba(13, 17, 28, 0.95));
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <canvas id="neural-bg"></canvas>

    <header class="p-4 flex items-center justify-between border-b border-purple-900/30 relative z-10">
        <a href="index.html" class="text-cyan-400 hover:text-cyan-300 transition flex items-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-arrow-left"></i> KEMBALI
        </a>
        <span class="text-xs tracking-widest text-purple-400 uppercase font-bold">YOUTUBE ROOM</span>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative z-10">
        <div class="card-glow rounded-3xl p-5 w-full">
            
            <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-black/40 border border-red-500/30 flex items-center justify-center text-red-500 text-2xl shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-wider mb-1">YOUTUBE DOWNLOADER</h1>
                <p class="text-[11px] text-gray-400">Preview video, pilih format MP4 / MP3, lalu download.</p>
            </div>

            <div class="space-y-3 mb-4">
                <div class="relative">
                    <input type="text" id="yt-url" placeholder="Tempel link YouTube di sini..." 
                        class="w-full bg-black/50 border border-purple-500/30 rounded-2xl py-3 px-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition">
                </div>
                <button onclick="processYouTubeDownload()" id="btn-process" 
                    class="w-full py-3 rounded-2xl font-bold text-xs bg-gradient-to-r from-red-600 to-purple-600 hover:from-red-500 hover:to-purple-500 text-white shadow-lg shadow-purple-900/40 transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Preview
                </button>
            </div>

            <div id="loading-box" class="hidden text-center py-6 text-cyan-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengambil data dari Nexray...
            </div>

            <!-- PREVIEW CONTAINER -->
            <div id="preview-container" class="hidden space-y-4 pt-2">
                
                <!-- THUMBNAIL PREVIEW -->
                <div class="relative w-full rounded-2xl overflow-hidden bg-black border border-purple-500/30 shadow-inner aspect-video flex items-center justify-center">
                    <img id="preview-thumb" class="w-full h-full object-cover" alt="Thumbnail">
                </div>

                <!-- INFO JUDUL & COPY -->
                <div class="bg-black/40 border border-purple-500/20 rounded-2xl p-3.5 space-y-2.5">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[10px] text-gray-400 font-semibold uppercase">Judul Video:</span>
                            <button onclick="copyTitle()" class="text-[10px] bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/40 text-purple-200 px-2.5 py-1 rounded-lg transition flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-copy"></i> <span id="copy-text">Copy Title</span>
                            </button>
                        </div>
                        <p id="preview-title" class="text-xs text-gray-200 leading-relaxed bg-black/30 p-2.5 rounded-xl border border-white/5 max-h-24 overflow-y-auto">Judul video...</p>
                    </div>
                </div>

                <!-- PILIHAN FORMAT DOWNLOAD -->
                <div class="space-y-2 pt-1">
                    <p class="text-[10px] font-bold text-purple-400 uppercase tracking-widest text-center">Pilih Format Unduhan</p>
                    
                    <button onclick="downloadMedia(currentVideoUrl, 'youtube_video.mp4', this)" class="w-full flex items-center justify-between py-3 px-4 bg-red-600/30 hover:bg-red-600/50 border border-red-500/40 rounded-xl text-xs font-semibold text-red-200 transition cursor-pointer">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-video text-red-400"></i> Download MP4 (Video)</span>
                        <span class="text-[10px] bg-red-500/20 px-2 py-0.5 rounded text-red-300">MP4</span>
                    </button>

                    <button onclick="downloadMedia(currentAudioUrl, 'youtube_audio.mp3', this)" class="w-full flex items-center justify-between py-3 px-4 bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/40 rounded-xl text-xs font-semibold text-emerald-200 transition cursor-pointer">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-music text-emerald-400"></i> Download MP3 (Audio)</span>
                        <span class="text-[10px] bg-emerald-500/20 px-2 py-0.5 rounded text-emerald-300">MP3</span>
                    </button>
                </div>

            </div>

        </div>
    </main>

    <div id="footer" class="relative z-10"></div>

    <script src="asset/js/all-tools-api.js"></script>
    <script>
        let currentVideoUrl = "";
        let currentAudioUrl = "";

        async function processYouTubeDownload() {
            const urlInput = document.getElementById('yt-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (!urlInput) {
                alert('Masukkan link YouTube terlebih dahulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                const result = await downloadYouTube(urlInput);
                
                if (result && result.status === "success") {
                    document.getElementById('preview-title').innerText = result.title;
                    document.getElementById('preview-thumb').src = result.thumbnail;
                    
                    // Simpan link mentah ke variabel global mirip ig.html
                    currentVideoUrl = result.video_url;
                    currentAudioUrl = result.audio_url;
                    
                    loadingBox.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                } else {
                    throw new Error(result?.message || "Gagal mengambil data.");
                }
            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        // Fungsi download meniru persis pola ig.html menggunakan Blob
        async function downloadMedia(fileUrl, filename, buttonElement) {
            const targetUrl = fileUrl;
            if (!targetUrl) {
                alert("Link unduhan untuk format ini tidak tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menyimpan...`;

            try {
                const response = await fetch(targetUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = targetUrl;
                a.setAttribute('download', filename);
                a.setAttribute('target', '_blank');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2000);
            }
        }

        function copyTitle() {
            const titleText = document.getElementById('preview-title').innerText;
            navigator.clipboard.writeText(titleText).then(() => {
                const copyTextSpan = document.getElementById('copy-text');
                copyTextSpan.innerText = "Copied!";
                setTimeout(() => {
                    copyTextSpan.innerText = "Copy Title";
                }, 2000);
            }).catch(err => {
                alert("Gagal menyalin judul!");
            });
        }

        fetch('components/footer-ai.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        }).catch(err => console.log("Footer load error:", err));
    </script>

    <script>
      const canvas = document.getElementById('neural-bg');
      const ctx = canvas.getContext('2d');
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', () => { resizeCanvas(); initNodes(); });
      resizeCanvas();
      const particlesArray = [];
      const colors = ['#00f2fe', '#bc13fe'];
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = (Math.random() * 0.5) - 0.25;
          this.speedY = (Math.random() * 0.5) - 0.25;
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        update() {
          this.x += this.speedX; this.y += this.speedY;
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      function initNodes() {
        particlesArray.length = 0;
        let numberOfParticles = (canvas.height * canvas.width) / 9500;
        if (numberOfParticles > 130) numberOfParticles = 130;
        for (let i = 0; i < numberOfParticles; i++) { particlesArray.push(new Particle()); }
      }
      function animateNodes() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
          for (let j = i; j < particlesArray.length; j++) {
            const dx = particlesArray[i].x - particlesArray[j].x;
            const dy = particlesArray[i].y - particlesArray[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              ctx.beginPath(); ctx.strokeStyle = particlesArray[i].color;
              ctx.globalAlpha = 1 - (distance / 150);
              ctx.lineWidth = 0.6; ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
              ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); ctx.globalAlpha = 1;
            }
          }
        }
        requestAnimationFrame(animateNodes);
      }
      window.onload = function() { initNodes(); animateNodes(); };
    </script>
</body>
</html>
