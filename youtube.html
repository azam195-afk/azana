<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - AZANA DESIGN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Poppins', 'sans-serif'], tech: ['Rajdhani', 'sans-serif'] }, colors: { neon: { cyan: '#00f2fe', purple: '#a855f7', magenta: '#d946ef' }, dark: { 950: '#050508', 900: '#0a0a0f', 800: '#13131a', 700: '#1c1c26' } } } } }
    </script>
  </head>
  <body class="min-h-screen bg-dark-900 text-slate-300 font-sans" style="background-image: radial-gradient(circle at 15% 30%, rgba(0,242,254,.08), transparent 28%), radial-gradient(circle at 85% 70%, rgba(168,85,247,.08), transparent 28%);">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
      <section class="w-full max-w-2xl rounded-3xl border border-dark-700 bg-dark-800/90 p-8 text-center shadow-[0_0_40px_rgba(0,242,254,0.08)] backdrop-blur">
        <a href="index.html" class="inline-flex items-center gap-2 text-[10px] font-tech uppercase tracking-[0.3em] text-neon-cyan hover:text-white"><i class="fas fa-arrow-left"></i> Kembali</a>
        <div class="mx-auto my-8 flex h-20 w-20 items-center justify-center rounded-2xl border border-neon-cyan/30 bg-dark-900 text-4xl text-neon-cyan shadow-[0_0_24px_rgba(0,242,254,0.18)]"><i class="fab fa-youtube"></i></div>
        <p class="font-tech text-xs uppercase tracking-[0.35em] text-neon-purple">Downloader</p>
        <h1 class="mt-3 text-4xl font-tech font-bold uppercase text-white">YouTube Downloader</h1>
        <p class="mx-auto mt-4 max-w-md text-sm leading-relaxed text-slate-400">Halaman tool minimalis untuk alur unduhan YouTube yang siap disambungkan ke layanan API.</p>
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
          <a href="index.html" class="inline-flex items-center justify-center gap-2 rounded-full bg-gradient-to-r from-neon-cyan to-neon-purple px-6 py-3 text-xs font-bold uppercase tracking-widest text-white transition hover:shadow-[0_0_24px_rgba(0,242,254,0.24)] active:scale-95">Lihat Semua Tools <i class="fas fa-arrow-right"></i></a>
          <a href="index.html#kontak" class="inline-flex items-center justify-center gap-2 rounded-full border border-neon-cyan/40 px-6 py-3 text-xs font-bold uppercase tracking-widest text-neon-cyan transition hover:bg-neon-cyan hover:text-dark-900 active:scale-95">Hubungi Admin</a>
        </div>
      </section>
    </main>
    <div id="footer"></div>
    <script src="all-tools-api.js"></script>
    <script>
      fetch('components/footer-ai.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById('footer').innerHTML = data;
        })
        .catch(err => console.error('Gagal load footer:', err));
    </script>
  </body>
</html>
