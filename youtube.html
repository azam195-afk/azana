<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - Azana Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Background Neural Khas Azana */
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 20%, rgba(147, 51, 234, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 10% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 30%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body class="p-4 relative overflow-x-hidden">

    <!-- Efek Garis Neural / Jaringan Abstrak di Background -->
    <div class="absolute inset-0 pointer-events-none z-0 opacity-20" style="background-image: radial-gradient(#a855f7 0.75px, transparent 0.75px); background-size: 24px 24px;"></div>

    <div class="max-w-md mx-auto w-full space-y-4 relative z-10">
        <!-- Header -->
        <div class="flex justify-between items-center bg-zinc-900/80 backdrop-blur-md p-3 rounded-2xl border border-zinc-800 shadow-lg">
            <a href="index.html" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-xl transition font-medium">← KEMBALI</a>
            <span class="text-xs font-bold text-purple-400 tracking-wider">YOUTUBE ROOM</span>
        </div>

        <!-- Main Card -->
        <div class="bg-zinc-950/90 backdrop-blur-md border border-purple-500/30 p-5 rounded-3xl shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-red-600/20 text-red-500 rounded-2xl mx-auto flex items-center justify-center text-xl shadow-inner">
                <i class="fa-brands fa-youtube"></i>
            </div>
            
            <h1 class="text-base font-bold tracking-wide">YOUTUBE DOWNLOADER</h1>
            <p class="text-xs text-zinc-400">Pilih video MP4 atau audio MP3 dengan Nexray API v1.</p>

            <!-- Input Form -->
            <div class="space-y-2.5">
                <input type="text" id="yt-url" placeholder="Tempel link YouTube di sini..." class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-purple-500 text-center text-zinc-200 shadow-inner">
                <button onclick="processYouTubeDownload()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 text-white font-bold text-xs py-3 rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i> Ambil Info Video
                </button>
            </div>

            <!-- Loading Box -->
            <div id="loading-box" class="hidden py-6">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-purple-500"></i>
                <p class="text-xs text-zinc-400 mt-2">Sedang memproses...</p>
            </div>

            <!-- Preview Container -->
            <div id="preview-container" class="hidden space-y-3 pt-2 text-left">
                <!-- Thumbnail & Judul -->
                <div class="space-y-3 text-center">
                    <div class="rounded-xl overflow-hidden bg-black aspect-video max-h-[180px] mx-auto flex items-center justify-center border border-zinc-800 shadow">
                        <img id="vid-thumbnail" src="" class="w-full h-full object-cover" alt="Thumbnail">
                    </div>
                    <div class="bg-black/50 border border-purple-500/20 rounded-2xl p-3 text-left shadow-inner">
                        <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Judul Video:</span>
                        <p id="vid-title" class="text-xs text-gray-200 line-clamp-2 mt-0.5 font-medium"></p>
                    </div>
                </div>

                <!-- Konten Tombol Download -->
                <div class="space-y-2.5 pt-2">
                    <!-- Tombol MP4 -->
                    <div class="bg-zinc-900/80 border border-zinc-700/50 rounded-2xl p-3 flex items-center justify-between shadow">
                        <div>
                            <p class="text-xs font-bold text-yellow-400"><i class="fa-solid fa-film mr-1"></i> Format MP4</p>
                            <span class="text-[10px] text-gray-400">High Quality Video</span>
                        </div>
                        <button onclick="triggerDownloadMP4(this)" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold text-xs px-4 py-2.5 rounded-xl transition shadow">
                            ↓ Download MP4
                        </button>
                    </div>

                    <!-- Tombol MP3 -->
                    <div class="bg-zinc-900/80 border border-zinc-700/50 rounded-2xl p-3 flex items-center justify-between shadow">
                        <div>
                            <p class="text-xs font-bold text-cyan-400"><i class="fa-solid fa-music mr-1"></i> Format MP3</p>
                            <span class="text-[10px] text-gray-400">High Quality Audio</span>
                        </div>
                        <button onclick="triggerDownloadMP3(this)" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs px-4 py-2.5 rounded-xl transition shadow">
                            ↓ Download MP3
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Khas Azana -->
    <div id="footer" class="relative z-10 text-center text-[10px] text-zinc-500 py-4 font-mono tracking-widest">
        AZANA DESIGN
    </div>

    <script>
        let videoDownloadUrl = "";
        let audioDownloadUrl = "";
        let videoTitle = "youtube_media";

        async function processYouTubeDownload() {
            const urlInput = document.getElementById('yt-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');

            if (!urlInput) {
                alert('Masukkan link YouTube dulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                // Menggunakan endpoint v1 terbaru sesuai permintaan
                const [resMp4, resMp3] = await Promise.all([
                    fetch(`https://api.nexray.eu.cc/downloader/v1/ytmp4?url=${encodeURIComponent(urlInput)}&resolusi=1080`).then(r => r.json()).catch(() => null),
                    fetch(`https://api.nexray.eu.cc/downloader/v1/ytmp3?url=${encodeURIComponent(urlInput)}`).then(r => r.json()).catch(() => null)
                ]);

                let title = "YouTube Video";
                let thumbnail = "https://i.ytimg.com/vi/3cjbQF5y3BE/hqdefault.jpg";

                if (resMp4 && resMp4.status === true && resMp4.result && resMp4.result.url) {
                    videoDownloadUrl = resMp4.result.url;
                    if (resMp4.result.title) title = resMp4.result.title;
                    if (resMp4.result.thumbnail) thumbnail = resMp4.result.thumbnail;
                }

                if (resMp3 && resMp3.status === true && resMp3.result && resMp3.result.url) {
                    audioDownloadUrl = resMp3.result.url;
                    if (resMp3.result.title) title = resMp3.result.title;
                    if (resMp3.result.thumbnail) thumbnail = resMp3.result.thumbnail;
                }

                if (!videoDownloadUrl && !audioDownloadUrl) {
                    throw new Error("Gagal mendapatkan link dari Nexray API.");
                }

                videoTitle = title.replace(/[\/\\?%*:|"<>]/g, '').trim();
                document.getElementById('vid-title').innerText = title;
                document.getElementById('vid-thumbnail').src = thumbnail;

                loadingBox.classList.add('hidden');
                previewContainer.classList.remove('hidden');

            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        // Trigger Download MP4 Murni (Anti-Play Tab Baru)
        async function triggerDownloadMP4(buttonElement) {
            if (!videoDownloadUrl) {
                alert("Link video belum tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengunduh...`;

            try {
                const response = await fetch(videoDownloadUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = videoTitle + '.mp4';
                document.body.appendChild(a);
                a.click();

                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = videoDownloadUrl;
                a.download = videoTitle + '.mp4';
                a.setAttribute('download', videoTitle + '.mp4');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2000);
            }
        }

        // Trigger Download MP3 Murni (Anti-Play Tab Baru)
        async function triggerDownloadMP3(buttonElement) {
            if (!audioDownloadUrl) {
                alert("Link audio belum tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengunduh...`;

            try {
                const response = await fetch(audioDownloadUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = 'YTSave_' + videoTitle + '.mp3';
                document.body.appendChild(a);
                a.click();

                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = audioDownloadUrl;
                a.download = 'YTSave_' + videoTitle + '.mp3';
                a.setAttribute('download', 'YTSave_' + videoTitle + '.mp3');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2000);
            }
        }
    </script>
</body>
</html>
