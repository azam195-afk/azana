<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - Azana Design</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 20%, #1a1f35 0%, #0b0f19 70%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .card-glow {
            background: rgba(17, 24, 39, 0.7);
            border: 1px string rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="justify-between">

    <!-- Container Utama -->
    <div class="max-w-md w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
        
        <!-- Tombol Kembali -->
        <div class="mb-4">
            <a href="index.html" class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> KEMBALI
            </a>
        </div>

        <!-- Box Utama Downloader -->
        <div class="card-glow rounded-3xl p-6 shadow-2xl relative overflow-hidden text-center space-y-6">
            
            <!-- Ikon & Judul -->
            <div class="space-y-2">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-red-600 to-red-800 flex items-center justify-center shadow-lg shadow-red-900/40">
                    <i class="fa-brands fa-youtube text-3xl text-white"></i>
                </div>
                <p class="text-[10px] tracking-widest text-purple-400 font-bold uppercase">Downloader</p>
                <h1 class="text-xl font-extrabold tracking-wide text-white">YOUTUBE DOWNLOADER</h1>
            </div>

            <!-- Input Form -->
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="yt-url" placeholder="Tempel link YouTube di sini..." class="w-full bg-gray-900/80 border border-gray-700/60 rounded-2xl px-4 py-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button onclick="processYouTubeDownload()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-2xl text-xs shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i> Cek / Proses Link
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading-box" class="hidden py-6">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-cyan-400"></i>
                <p class="text-xs text-gray-400 mt-2">Memproses video & audio...</p>
            </div>

            <!-- Preview & Hasil Download -->
            <div id="preview-container" class="hidden space-y-4 pt-2 border-t border-gray-800">
                <div id="media-view-area"></div>
            </div>

        </div>
    </div>

    <!-- Footer Konsisten Azana Design -->
    <footer class="text-center py-6 text-xs text-gray-500 space-y-1">
        <p class="font-bold text-gray-400">AZANA DESIGN</p>
        <p>Kembali ke pusat layanan desain dan editing profesional.</p>
        <div class="flex justify-center gap-4 pt-2">
            <a href="index.html" class="hover:text-cyan-400 transition">Back to Main Site</a>
        </div>
    </footer>

    <!-- Script Proses API -->
    <script>
        async function processYouTubeDownload() {
            const urlInput = document.getElementById('yt-url').value.trim();
            const loadingBox = document.getElementById('loading-box');
            const previewContainer = document.getElementById('preview-container');
            const viewArea = document.getElementById('media-view-area');

            if (!urlInput) {
                alert('Masukkan link YouTube dulu, bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            previewContainer.classList.add('hidden');

            try {
                let cleanUrl = urlInput.trim();

                // Menggunakan endpoint AIO untuk mengantisipasi error di ytmp4, dan ytmp3 untuk audionya
                const [resAio, resMp3] = await Promise.all([
                    fetch(`https://api.nexray.eu.cc/downloader/aio?url=${encodeURIComponent(cleanUrl)}`).then(r => r.json()).catch(() => null),
                    fetch(`https://api.nexray.eu.cc/downloader/ytmp3?url=${encodeURIComponent(cleanUrl)}`).then(r => r.json()).catch(() => null)
                ]);

                // Ambil data video dari AIO atau fallback ke hasil lain
                let videoUrl = "";
                let title = "YouTube Video";
                let thumbnail = "";

                if (resAio && resAio.status && resAio.result) {
                    const item = Array.isArray(resAio.result) ? resAio.result[0] : resAio.result;
                    videoUrl = item.url || item.download || "";
                    title = item.title || title;
                    thumbnail = item.thumbnail || "";
                }

                // Ambil data audio MP3 dari ytmp3
                let audioUrl = "";
                if (resMp3 && resMp3.status && resMp3.result) {
                    audioUrl = resMp3.result.url || "";
                    if (!title && resMp3.result.title) title = resMp3.result.title;
                }

                if (!videoUrl && !audioUrl) {
                    throw new Error("Gagal mengambil data dari server. Coba link YouTube lain.");
                }

                // Render tampilan hasil lengkap dengan tombol ganda (MP4 & MP3)
                viewArea.innerHTML = `
                    <div class="space-y-3 text-center">
                        ${thumbnail ? `
                        <div class="rounded-xl overflow-hidden bg-black aspect-video max-h-[160px] mx-auto flex items-center justify-center border border-gray-800">
                            <img src="${thumbnail}" class="w-full h-full object-cover" alt="Thumbnail">
                        </div>` : ''}
                        <h3 class="text-xs font-semibold text-white truncate px-2">${title}</h3>
                        
                        <div class="flex gap-2 justify-center pt-1">
                            ${videoUrl ? `
                            <button onclick="downloadMedia('${videoUrl}', 'youtube_video.mp4', this)" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-lg">
                                <i class="fa-solid fa-video"></i> MP4
                            </button>` : ''}
                            ${audioUrl ? `
                            <button onclick="downloadMedia('${audioUrl}', 'youtube_audio.mp3', this)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-lg">
                                <i class="fa-solid fa-music"></i> MP3
                            </button>` : ''}
                        </div>
                    </div>
                `;
                
                loadingBox.classList.add('hidden');
                previewContainer.classList.remove('hidden');
            } catch (err) {
                loadingBox.classList.add('hidden');
                alert("Terjadi kesalahan: " + err.message);
            }
        }

        async function downloadMedia(fileUrl, filename, buttonElement) {
            if (!fileUrl) {
                alert("Link unduhan tidak tersedia!");
                return;
            }

            const originalContent = buttonElement.innerHTML;
            buttonElement.disabled = true;
            buttonElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (err) {
                const a = document.createElement('a');
                a.href = fileUrl;
                a.setAttribute('download', filename);
                a.setAttribute('target', '_blank');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } finally {
                setTimeout(() => {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalContent;
                }, 2000);
            }
        }
    </script>
</body>
</html>
